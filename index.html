<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Il Viaggio Arcade</title>
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Il Viaggio">
<meta name="description" content="Juego arcade para practicar italiano de A1 a B1 viajando por Italia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Un solo mundo visual (arcade de 16 colores): pantalla arriba, mando abajo, ventanas tipo RPG encima. */
:root{
  --bg:#1a1c2c; --panel:#f4f4e4; --ink:#1a1c2c; --mute:#566c86; --accent:#ffcd75; --blue:#3b5dc9;
  --good:#38b764; --bad:#b13e53; --good-bg:#d3f0d6; --bad-bg:#f6d5d8;
  --px:"Press Start 2P",ui-monospace,monospace; --tx:"VT323",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--panel);height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{font-family:var(--tx);font-size:22px;line-height:1.15}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;padding:8px 8px 10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
#cv{flex:none;align-self:center;width:100%;height:auto}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--px);font-size:11px}
.hud .hearts{color:var(--bad);letter-spacing:2px;font-size:14px}.hud .off{color:#333c57}
.goal{font-size:18px;line-height:1.1;color:var(--accent);height:40px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #333c57;background:#000}
.pad{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 6px;margin-top:auto}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mbtn{font-family:var(--px);font-size:7px;padding:5px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);box-shadow:0 3px 0 #000;line-height:1}
.mbtn .i{font-size:16px;line-height:1}.mbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.abtn{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--ink);font-family:var(--px);font-size:26px;border:4px solid var(--ink);box-shadow:0 5px 0 #000;flex:none}
.abtn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.padhint{flex:1;text-align:center;font-size:17px;color:var(--mute);margin:0}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);flex:none}
.dpad button{background:#333c57;border:3px solid #566c86;color:var(--panel);font-family:var(--px);font-size:14px}
.dpad button:active,.dpad button.on{background:var(--blue)}
.side{display:flex;flex-direction:column;gap:7px;align-items:stretch;flex:1;max-width:190px}
.pbtn{font-family:var(--px);font-size:10px;padding:12px 8px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 #000;line-height:1.3}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.pbtn.a{background:var(--accent);font-size:13px;padding:16px 8px}
.pbtn.go{background:var(--accent);width:100%;margin-top:6px}
.pbtn:disabled{opacity:.45}
#ov{position:fixed;inset:0;background:rgba(10,12,22,.82);padding:14px 16px;display:none;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:5}
#ov.show{display:flex;flex-direction:column}
#ov:not(.top) .win{margin-top:auto;margin-bottom:auto}
.win{background:var(--panel);color:var(--ink);border:4px solid var(--ink);outline:4px solid var(--panel);box-shadow:0 0 0 8px var(--ink);padding:16px 14px;display:flex;flex-direction:column;gap:12px;margin:8px auto;width:calc(100% - 16px);max-width:448px;flex:none}
.win h2{font-family:var(--px);font-size:13px;line-height:1.5;margin:0;text-wrap:balance}
.win p{margin:0}
.eyebrow{font-family:var(--px);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.it{font-size:27px;line-height:1.15}
.blank{display:inline-block;min-width:56px;border-bottom:3px solid var(--blue);text-align:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#fff;border:3px solid var(--ink);padding:10px 12px;text-align:left;font-size:25px;color:var(--ink);width:100%;line-height:1.1}
.opt.ok{background:var(--good-bg);border-color:var(--good)}.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{background:#fff;border:3px solid var(--ink);padding:6px 10px;font-size:25px;color:var(--ink)}
.tile.ok{background:var(--good-bg);border-color:var(--good)}.tile.no{background:var(--bad-bg);border-color:var(--bad)}
.answer{min-height:50px;border-bottom:3px dashed var(--mute);padding-bottom:6px}
.word{background:none;border:0;border-bottom:3px solid transparent;padding:0 2px;font-size:27px;color:var(--ink)}
.word.ok{background:var(--good-bg);border-color:var(--good)}.word.no{background:var(--bad-bg);border-color:var(--bad);text-decoration:line-through}
.fb{border:3px solid;padding:10px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-bg);border-color:var(--good)}.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb b{font-family:var(--px);font-size:11px}
table{border-collapse:collapse;width:100%;font-size:21px}
td{border:2px solid var(--ink);padding:4px 6px;vertical-align:top;background:#fff}
td:first-child{background:var(--accent);white-space:nowrap}
.tip{background:#fff;border-left:6px solid var(--blue);padding:6px 8px}
.gl{border-bottom:3px dotted var(--blue);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font-family:var(--px);font-size:8px;padding:8px 6px;background:#fff;border:3px solid var(--ink);color:var(--ink)}
.tab.on{background:var(--ink);color:var(--panel)}
.hp{color:var(--bad);letter-spacing:2px}
.star{color:#e08a00}.star.off{color:#b8b8a6}
.mute{color:var(--mute)}
.mapbtn{display:flex;justify-content:space-between;gap:8px;width:100%;background:#fff;border:3px solid var(--ink);padding:8px 10px;color:var(--ink);font-size:24px;text-align:left}
.mapbtn:disabled{opacity:.4}
.pic{width:100%;height:auto;display:block;image-rendering:pixelated;border:3px solid var(--ink)}
#italy,#trip{width:100%;max-width:320px;align-self:center;image-rendering:pixelated;border:3px solid var(--ink)}
.center{text-align:center}
.wheel{font-size:44px;text-align:center;transition:transform .5s;line-height:1}
.phrase{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center}.rw{display:inline-flex;gap:3px}
.rc{width:20px;height:28px;border-bottom:3px solid var(--ink);font-family:var(--px);font-size:12px;display:flex;align-items:flex-end;justify-content:center;color:var(--ink);padding-bottom:2px}
@media (prefers-reduced-motion:reduce){.wheel{transition:none}}
.lvcard{background:#fff;border:3px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:6px}
.lvcard.cur{outline:3px solid var(--accent);outline-offset:2px}.lvcard.locked{background:#dfe3e8;color:var(--mute)}
.lvn{font-family:var(--px);font-size:18px;background:var(--ink);color:var(--panel);width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.lvst{font-family:var(--px);font-size:9px}.lvst.ok{color:var(--good)}.lvst.cur{color:var(--blue)}
.lvbar{height:10px;border:2px solid var(--ink);background:#fff}.lvbar i{display:block;height:100%;background:var(--good)}
.theme{display:flex;flex-direction:column;gap:4px;background:#fff;border:3px solid var(--ink);padding:10px}.theme b{font-family:var(--px);font-size:11px;line-height:1.5}.theme .ex{color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:#fff;border:2px solid var(--ink);padding:2px 8px;font-size:19px}
.ring{font-family:var(--px);font-size:14px;color:var(--bad);animation:ring .25s infinite alternate}
@keyframes ring{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.helpbox{border:3px dashed var(--blue);padding:8px;display:flex;flex-direction:column;gap:8px;background:#fff}
.clues{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font-size:20px}.clues li.done{color:var(--good)}.clues b{font-family:var(--px);font-size:11px;letter-spacing:1px}
.cell.s.ok{background:var(--good-bg);border-color:var(--good)}
.idrow.new{background:#fff3d6;outline:2px dashed var(--accent)}
.wd{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:230px;width:100%;align-self:center}
.wc{aspect-ratio:1;border:3px solid var(--ink);background:#fff;font-family:var(--px);font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.wc.g,.key.g{background:#38b764;color:#fff;border-color:#257179}.wc.y,.key.y{background:#ffcd75}.wc.x,.key.x{background:#94b0c2;color:#fff}
.kb{display:flex;flex-direction:column;gap:4px}.kr{display:flex;gap:3px;justify-content:center}
.key{flex:1;max-width:32px;padding:11px 0;font-family:var(--px);font-size:10px;border:2px solid var(--ink);background:#fff;color:var(--ink)}.key.wide{max-width:58px;flex:1.7;font-size:8px}
.small{font-size:17px}
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:22px}
.check li.ok{color:var(--good)}
.pippo{width:96px;height:72px;image-rendering:pixelated;border:3px solid var(--ink);align-self:center}
.keyw{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.keyw span{width:26px;height:26px;border:3px solid var(--ink);background:#fff;font-family:var(--px);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.keyw span.on{background:var(--accent)}
.cw{display:grid;gap:2px;align-self:center;width:100%}
.cwc{aspect-ratio:1;background:#fff;border:2px solid var(--ink);position:relative;font-family:var(--px);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cwc.x{background:transparent;border-color:transparent}.cwc.r{background:var(--good-bg)}
.cwc small{position:absolute;top:1px;left:2px;font-size:6px;font-family:var(--px)}
.cwin{flex:1;min-width:0;font-family:var(--px);font-size:13px;padding:10px;border:3px solid var(--ink);text-transform:uppercase;color:var(--ink);background:#fff}
.tile.shelf{display:flex;flex-direction:column;align-items:center;font-size:20px;line-height:1.05;min-width:84px}
.emo{font-size:26px}
summary{cursor:pointer;font-family:var(--px);font-size:9px;padding:6px 0}
.sopa{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.cell{aspect-ratio:1;background:#fff;border:2px solid var(--ink);font-family:var(--px);font-size:11px;color:var(--ink);padding:0}
.cell.f{background:var(--good-bg);border-color:var(--good)}.cell.s{background:var(--accent)}
.words{font-family:var(--px);font-size:10px;line-height:1.8;text-align:center}
.face{width:120px;height:132px;image-rendering:pixelated;border:3px solid var(--ink);align-self:center}
.idrow{display:grid;grid-template-columns:84px 40px 1fr 40px;align-items:center;gap:6px}
.idrow .it{text-align:center;font-size:24px}
.legend{font-size:19px;margin:0}
.tile.sel{background:var(--accent)}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:6px 10px;border:3px solid var(--ink);background:#fff;font-size:25px;line-height:1.1;align-self:flex-start}
.bub.me{align-self:flex-end;background:var(--accent)}
.bar{height:14px;border:3px solid var(--ink);background:#fff}
.bar i{display:block;height:100%;background:var(--blue);animation:shrink 4s linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
.big{font-size:36px;text-align:center;min-height:44px;line-height:1.1}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo .opt{text-align:center;font-family:var(--px);font-size:10px;padding:18px 6px;line-height:1.4}
.chip{display:inline-block;font-family:var(--px);font-size:8px;padding:3px 6px;background:var(--accent);color:var(--panel);vertical-align:middle}
.nbhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ntabs{display:flex;gap:3px;padding-left:22px;margin-bottom:-12px;position:relative;z-index:1}
.ntab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--px);font-size:6px;letter-spacing:-.2px;padding:7px 2px 8px;border:3px solid var(--ink);border-bottom:none;border-radius:8px 8px 0 0;background:var(--c);color:#fff;filter:saturate(.55) brightness(.9);transform:translateY(5px)}
.ntab span{font-size:15px;line-height:1}
.ntab.on{filter:none;transform:none;padding-bottom:13px}
.nbk{position:relative;background:#fffdf3 repeating-linear-gradient(180deg,transparent 0 25px,#dbe6f0 25px 26px);border:3px solid var(--ink);border-top:8px solid var(--c);padding:10px 10px 14px 30px;display:flex;flex-direction:column;gap:6px;min-height:220px}
.nbk:before{content:"";position:absolute;left:23px;top:0;bottom:0;width:2px;background:#e6a3a3}
.nbk:after{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:12px;background:radial-gradient(circle at 6px 6px,var(--ink) 3px,#c5d3dc 4px,transparent 5px) 0 0/12px 20px repeat-y}
.lvh{font-family:var(--px);font-size:7px;color:var(--mute);margin-top:8px;border-bottom:2px dashed var(--mute);padding-bottom:4px}
.pg{background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(26,28,44,.25)}
.pg summary{list-style:none;cursor:pointer;padding:9px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:18px}
.pg summary::-webkit-details-marker{display:none}
.pg summary b{font-family:var(--px);font-size:8px}
.pg summary:after{content:"▸";margin-left:auto;font-family:var(--px);font-size:9px}
.pg[open] summary{border-bottom:2px dashed #c5d3dc;background:#f4f4e4}
.pg[open] summary:after{content:"▾"}
.pgt{color:var(--mute);font-size:16px}
.pgb{padding:8px;display:flex;flex-direction:column;gap:8px}
.nbk{font-size:22px;line-height:1.1}.pgb table{width:100%;table-layout:fixed}.pgb td{overflow-wrap:anywhere;font-size:20px;line-height:1.15;padding:5px 6px;vertical-align:middle}.nbk .tip{font-size:20px}.pgb td:first-child{white-space:normal}.nbk .it,.nbk p,.nbk .pc p{font-size:21px;line-height:1.15}.nbk .ex{font-size:22px}
.fchip{display:inline-block;font-family:var(--px);font-size:6px;color:#fff;padding:3px 5px;vertical-align:middle}
.spk1{border:2px solid var(--ink);background:var(--accent);font-size:11px;padding:1px 4px;vertical-align:middle;line-height:1.2}
.pc{background:#fff;border:2px dashed var(--mute);padding:8px 10px;transform:rotate(-1deg)}
.fcard{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;border:3px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink);padding:14px}
.fcard.flip{background:#fff7e0}
.fces{font-size:20px;color:var(--mute);margin-top:8px}
.hintw{border-top:2px dashed #c5d3dc;padding-top:6px;display:flex;flex-direction:column;gap:4px;font-size:20px}.hintw .it,.hl .it{font-size:20px}.hintw>b{display:inline}.hintw:first-child{border-top:none}.hl{background:#fff7e0;border-left:4px solid var(--accent);padding:4px 6px;font-size:20px}.pat{font-family:var(--px);font-size:10px;letter-spacing:2px}
.story{background:#fff7e0;border:3px solid var(--ink);border-left:8px solid #a7663a;padding:8px 10px;display:flex;flex-direction:column;gap:6px}.story .it{font-size:21px;line-height:1.15}
.howto{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}.howi{font-size:44px;line-height:1}
.chalk{background:radial-gradient(ellipse at 30% 20%,#43664f,#2a4434 75%);border:10px solid #8b5a2b;box-shadow:inset 0 0 0 2px #5d3a1a,0 4px 0 #000;padding:12px 12px 0;color:#f4f4e4;font-family:var(--tx);text-shadow:0 0 1px rgba(255,255,255,.55);display:flex;flex-direction:column;gap:6px}
.chhead{display:flex;justify-content:space-between;font-size:18px;opacity:.75}
.chtitle{font-family:var(--px);font-size:13px;line-height:1.5;color:#fff;text-decoration:underline wavy #ffe58a;text-underline-offset:5px;margin:2px 0}
.chintro{font-size:22px;line-height:1.15}
.chh{font-family:var(--px);font-size:10px;color:#9fe0ff;margin-top:10px;padding-bottom:5px;border-bottom:2px solid rgba(159,224,255,.45);letter-spacing:.04em}
.cht{width:100%;border-collapse:collapse;font-size:21px;table-layout:fixed}
.cht col.cl{width:34%}.cht.c3 col.cl{width:26%}.cht.c4{font-size:19px}.cht.c4 col.cl{width:18%}.cht.c4 td,.cht.c4 th{padding-left:3px;padding-right:3px}
.cht .nw{white-space:nowrap}
.chalk .cht td,.chalk .cht th{background:transparent;border:none;border-bottom:1px solid rgba(244,244,228,.18);color:#f4f4e4;padding:6px 5px;white-space:normal;vertical-align:middle;overflow-wrap:break-word;word-break:normal;hyphens:manual;line-height:1.1;text-align:left}
.chalk .cht tr:nth-child(even) td{background:rgba(0,0,0,.12)}
.chalk .cht th{font-family:var(--px);font-size:8px;color:#c9e7d2;font-weight:normal;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid rgba(244,244,228,.4);padding:4px 5px 6px}
.chalk .cht td:first-child{color:#ffe58a;background-clip:padding-box;white-space:normal}
.chalk .cht td.cl b{display:block;font-weight:normal}
.chalk .cht td.cl small{display:block;font-size:16px;color:#e8d79a;opacity:.85;line-height:1}
.cht .art{color:#ffb3c7}
.cht .sep{opacity:.5}
.chtip{border:2px dashed #ffb3c7;background:rgba(255,179,199,.08);color:#ffd6e0;padding:8px 10px;margin-top:10px;font-size:20px;line-height:1.2}
.pxi{width:1.05em;height:1.05em;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:-.15em;display:inline-block}
.chtype span .pxi{width:28px;height:28px}
.profcard{display:flex;gap:10px;align-items:center;background:#1a1c2c;color:#f4f4e4;border:3px solid var(--ink);box-shadow:0 0 0 2px #ffcd75 inset;padding:8px}
.profpic{width:64px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid #ffcd75;flex:none}
.profinfo{display:flex;flex-direction:column;gap:3px;min-width:0}.profinfo .eyebrow{color:#ffcd75}.profinfo b{font-family:var(--px);font-size:11px;font-weight:normal;color:#fff}
.profsay{font-size:19px;line-height:1.1;color:#c5d3dc}
#wpop{position:fixed;z-index:50;display:none;flex-direction:column;gap:4px;background:#1a1c2c;color:#f4f4e4;border:3px solid #ffcd75;box-shadow:0 0 0 3px #1a1c2c,0 6px 0 rgba(0,0,0,.5);padding:8px 10px;font-family:var(--tx);font-size:22px;line-height:1.1}
#wpop.show{display:flex}#wpop b{font-family:var(--px);font-size:11px;font-weight:normal;color:#ffcd75}#wpop .wtr{font-size:24px}#wpop .wsent{font-size:20px;color:#9fe0ff}
#wpop .wbtns{display:flex;gap:6px;margin-top:2px}#wpop button{background:#333c57;border:2px solid #94b0c2;color:#f4f4e4;font-family:var(--px);font-size:8px;padding:6px 8px;display:flex;align-items:center;gap:4px}
#ov{-webkit-touch-callout:none}
.chex{color:#9fe0ff;font-size:21px;line-height:1.2;border-left:4px solid #9fe0ff;padding:4px 8px;background:rgba(159,224,255,.08)}
.win:has(>.chalk){padding:12px 8px}.chalk{border-width:7px;padding:10px 10px 0}.chalk .chtray{margin:10px -10px 0}
.chtray{height:10px;background:#8b5a2b;margin:8px -12px 0;position:relative;box-shadow:0 -2px 0 #5d3a1a}
.chtray i{position:absolute;left:24px;top:-5px;width:18px;height:5px;background:#fff}.chtray b{position:absolute;left:52px;top:-7px;width:28px;height:7px;background:#566c86;border-top:3px solid #c5d3dc}
.shopsign{align-self:center;background:#1a1c2c;color:var(--accent);font-family:var(--px);font-size:11px;padding:8px 12px;border:3px solid var(--accent);text-align:center;display:flex;flex-direction:column;gap:4px}.shopsign small{font-family:var(--tx);font-size:18px;color:#f4f4e4}.meas{display:inline-block;background:var(--ink);color:var(--accent);font-family:var(--px);font-size:7px;padding:2px 4px;margin-left:2px;vertical-align:middle}
.chchips,.chtypes{display:flex;flex-wrap:wrap;gap:6px}
.chchip{background:transparent;border:2px dashed rgba(244,244,228,.5);color:#f4f4e4;font-family:var(--tx);font-size:19px;padding:5px 8px;text-align:left}
.chchip small{opacity:.7}.chchip.on{border:2px solid #ffe58a;background:rgba(255,229,138,.15);color:#ffe58a}
.chtype{flex:1 1 40%;background:rgba(0,0,0,.18);border:2px solid #f4f4e4;color:#f4f4e4;font-family:var(--px);font-size:8px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.chtype span{font-size:22px}
.chq{font-size:25px;line-height:1.15;color:#fff;margin:6px 0}
.chopts{display:flex;flex-direction:column;gap:6px}
.chopt{background:transparent;border:2px solid rgba(244,244,228,.6);color:#f4f4e4;font-family:var(--tx);font-size:22px;padding:6px 10px;text-align:left}
.chopt.ok{border-color:#8ff0a4;color:#8ff0a4;background:rgba(56,183,100,.2)}.chopt.no{border-color:#ff9aa8;color:#ff9aa8;text-decoration:line-through}
.chgood{color:#8ff0a4;font-size:22px}.chbad{color:#ff9aa8;font-size:22px}.chgood span,.chbad span{color:#f4f4e4;font-size:19px;display:block}
.chbar{height:6px;background:rgba(0,0,0,.25)}.chbar i{display:block;height:100%;background:#ffe58a}
.chans{color:#ffe58a;font-size:26px}
#wpad{width:100%;max-width:420px;align-self:center;height:auto;border:2px dashed rgba(244,244,228,.45);touch-action:none;background:#2a4434}
.mwrap{position:relative;display:flex;justify-content:space-between;gap:34px}.mwrap svg{position:absolute;left:0;top:0;pointer-events:none}
.mcol{flex:1;display:flex;flex-direction:column;gap:8px}
.mbx{background:rgba(0,0,0,.18);border:2px solid rgba(244,244,228,.6);color:#f4f4e4;font-family:var(--tx);font-size:20px;padding:6px 6px;min-height:44px;line-height:1.05}
.mbx.sel{border-color:#ffe58a;color:#ffe58a;box-shadow:0 0 0 2px #ffe58a}.mbx.no{border-color:#ff9aa8;color:#ff9aa8}.mbx.ok{background:rgba(0,0,0,.28)}
.memo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mcard{min-width:0;overflow:hidden;min-height:66px;background:#5d3a1a;border:3px solid #8b5a2b;color:#ffe58a;font-family:var(--px);font-size:14px;display:flex;align-items:center;justify-content:center;padding:3px}
.mcard.up{background:#f4f4e4;color:#1a1c2c;font-family:var(--tx);font-size:17px;line-height:1.05;border-color:#f4f4e4;word-break:normal;overflow-wrap:break-word;hyphens:auto;padding:6px 3px}.mcard.up.it{color:#29366f}.mcard.ok{background:#8ff0a4;border-color:#38b764}
.obuilt{min-height:46px;border-bottom:2px dashed rgba(244,244,228,.5);display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}.obank{display:flex;flex-wrap:wrap;gap:6px}
.ochip{background:rgba(0,0,0,.2);border:2px solid #f4f4e4;color:#f4f4e4;font-family:var(--tx);font-size:21px;padding:4px 8px}.ochip.on{border-color:#ffe58a;color:#ffe58a}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fcell{min-width:0;overflow:hidden;background:#f4f4e4;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.fcell span{font-size:40px;line-height:1}.fcell small{font-family:var(--tx);font-size:14px;line-height:1;overflow-wrap:anywhere;text-align:center}.fcell.ok{background:#8ff0a4}.fcell.no{background:#ffb3c7}
.hrow{display:flex;align-items:center;gap:10px}.hrow canvas{width:110px;height:110px;flex:none;background:transparent!important;border:none!important;box-shadow:none!important}
.hword{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--px);font-size:16px;color:#ffe58a}.hword span{min-width:16px;text-align:center;border-bottom:2px solid #f4f4e4}
.hkeys{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.hk{background:transparent;border:2px solid rgba(244,244,228,.6);color:#f4f4e4;font-family:var(--px);font-size:11px;padding:8px 0}.hk.ok{border-color:#8ff0a4;color:#8ff0a4}.hk.no{border-color:#ff9aa8;color:#ff9aa8;opacity:.6}
#hcard{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:60;max-width:460px;margin:0 auto}
#hcard .hcin{background:#fff7e0;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:20px}
#hcard .hl.new{border-left-color:#38b764;background:#e5f4e4}
#hcard .it,#hcard .hl{color:var(--ink)}#hcard .hcin{max-height:46vh;overflow-y:auto}
.newrow td{background:#8ff0a4!important;font-weight:bold}
.lugrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.lucard{background:#c5d3dc;border:3px solid var(--ink);padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}.lucard canvas{width:100%;height:auto;image-rendering:pixelated}.lucard span{font-family:var(--px);font-size:9px}.lucard.no{opacity:.35}.lucard.ok{background:#8ff0a4}
.fcell.place span{position:relative}.parr{position:absolute;right:-12px;bottom:-6px;font-size:20px;background:#ffcd75;border:2px solid var(--ink);border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;line-height:1}
.mgrid{display:grid;gap:0;border:3px solid var(--ink);background:var(--ink);max-width:360px;align-self:center;width:100%}
.mcell{aspect-ratio:1;min-width:0;background:#f4f4e4;border:1px solid #94b0c2;font-size:26px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}.mcell.given{background:#c5d3dc}.mcell.sel{background:#ffcd75}.mcell.no{background:#ffb3c7}.mcell.ok{background:#8ff0a4}
.mpal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.mpb{background:#fff;border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;padding:4px;min-width:0}.mpb span{font-size:26px}.mpb small{font-family:var(--tx);font-size:15px;line-height:1;text-align:center;overflow-wrap:anywhere}.mpb:disabled{opacity:.5}
.tile.sel{background:#ffcd75}
.bub.good{border-color:#38b764;background:#e5f4e4}.bub.wrong{border-color:#b13e53;background:#ffe1e6;text-decoration:line-through;text-decoration-color:rgba(177,62,83,.6)}.bub.react{background:#fff7e0;font-style:italic}
</style>

<body>
<main id="app">
  <div class="hud"><span id="hCity"></span><span id="hStamps"></span><span class="hearts" id="hHearts"></span></div>
  <nav class="menu" aria-label="Menú">
    <button class="mbtn" id="bNote"><span class="i">📒</span>QUADERNO</button>
    <button class="mbtn" id="bMap"><span class="i">🗺️</span>MAPPA</button>
    <button class="mbtn" id="bDos"><span class="i">🕵️</span>DOSSIER</button>
    <button class="mbtn" id="bHelp"><span class="i">🐦</span>AIUTO</button>
  </nav>
  <div class="goal" id="goal"></div>
  <canvas id="cv" width="208" height="272" aria-label="Mapa de la ciudad. Toca un lugar para caminar hasta allí."></canvas>
  <div class="pad">
    <div class="dpad" id="dpad">
      <span></span><button data-d="up" aria-label="Arriba">▲</button><span></span>
      <button data-d="left" aria-label="Izquierda">◀</button><span></span><button data-d="right" aria-label="Derecha">▶</button>
      <span></span><button data-d="down" aria-label="Abajo">▼</button><span></span>
    </div>
    <p class="padhint" id="padhint">Toca el mapa para caminar</p>
    <button class="abtn" id="bA" aria-label="A: hablar o entrar">A</button>
  </div>
  <div id="ov"></div>
</main>
<script>
const LEVELS=[
{city:"Torino",tema:"Passato prossimo",roof:"#b13e53",
 lesson:{intro:"El passato prossimo cuenta hechos terminados. Se forma con el presente de AVERE o ESSERE + participio.",
  tabs:[{h:"Participio regular",r:[["-are → -ato","parlare → parlato"],["-ere → -uto","credere → creduto"],["-ire → -ito","dormire → dormito"]]},
   {h:"¿Avere o essere?",r:[["AVERE","la mayoría: ho mangiato, ho visto"],["ESSERE","movimiento y cambio: andare, venire, uscire, arrivare, rimanere, nascere"],["ESSERE","reflexivos: mi sono alzato"]]},
   {h:"Irregulares frecuentes",r:[["fare","fatto"],["prendere","preso"],["vedere","visto"],["dire","detto"],["bere","bevuto"],["rimanere","rimasto"],["essere","stato"],["venire","venuto"]]}],
  tip:"Con ESSERE el participio concuerda con el sujeto: Marta è andata, i ragazzi sono andati."},
 pairs:[["fare","fatto"],["prendere","preso"],["vedere","visto"],["dire","detto"],["bere","bevuto"],["rimanere","rimasto"]],
 text:"Sono arrivato a Torino ieri sera, con il treno delle otto. Ho lasciato la {valigia|maleta} in {albergo|hotel} e sono uscito subito a {fare due passi|dar un paseo}. In piazza ho incontrato Marta, una ragazza torinese, che mi ha consigliato un bar storico. Abbiamo bevuto un bicerin, la {bevanda|bebida} tipica della città, e siamo rimasti a parlare fino a tardi.",
 q:[
 {t:"mc",q:"Che cosa ha fatto il protagonista appena arrivato?",o:["Ha lasciato la valigia in albergo","È andato subito a dormire","Ha cenato con Marta"],e:"El texto dice: «Ho lasciato la valigia in albergo e sono uscito subito»."},
 {t:"gap",s:"Ieri Marta ___ al mercato.",o:["è andata","ha andato","è andato"],e:"Andare usa essere, y el participio concuerda con el sujeto femenino: andata."},
 {t:"gap",s:"Noi ___ un caffè in piazza.",o:["abbiamo preso","siamo presi","abbiamo prenduto"],e:"Prendere usa avere y tiene participio irregular: preso."},
 {t:"gap",s:"Le ragazze ___ presto stamattina.",o:["si sono alzate","si hanno alzato","si sono alzati"],e:"Los verbos reflexivos usan essere; el participio concuerda: alzate (femenino plural)."},
 {t:"order",es:"Nos quedamos hablando hasta tarde.",a:["siamo rimasti a parlare fino a tardi","fino a tardi siamo rimasti a parlare"],e:"Rimanere usa essere: siamo rimasti. «Fino a tardi» = hasta tarde."}
 ]},
{city:"Milano",tema:"Imperfetto o passato prossimo",roof:"#566c86",
 lesson:{intro:"El imperfetto describe el fondo: cómo eran las cosas, hábitos y acciones en curso. El passato prossimo cuenta el hecho puntual.",
  tabs:[{h:"Terminaciones",r:[["parlare","parlavo, parlavi, parlava, parlavamo, parlavate, parlavano"],["credere","credevo, credevi, credeva, credevamo, credevate, credevano"],["dormire","dormivo, dormivi, dormiva, dormivamo, dormivate, dormivano"]]},
   {h:"Irregulares",r:[["essere","ero, eri, era, eravamo, eravate, erano"],["fare","facevo"],["dire","dicevo"],["bere","bevevo"]]},
   {h:"¿Cuál uso?",r:[["Imperfetto","mentre…, da bambino…, ogni estate, sempre, faceva freddo"],["Passato pr.","ieri, una volta, all'improvviso, due anni fa"]]}],
  tip:"Mentre + imperfetto, y lo que interrumpe va en passato prossimo: Mentre dormivo, è squillato il telefono."},
 pairs:[["io · parlare","parlavo"],["noi · essere","eravamo"],["lui · fare","faceva"],["tu · dire","dicevi"],["loro · avere","avevano"],["voi · bere","bevevate"]],
 text:"A Milano pioveva e faceva freddo. Mentre camminavo verso il Duomo, ho sentito qualcuno chiamare il mio nome: era Luca, un vecchio amico dell'università. Da studenti andavamo sempre insieme allo {stadio|estadio}. Mi ha invitato a {pranzo|almuerzo} e, mentre mangiavamo il risotto, mi ha raccontato del suo nuovo lavoro.",
 q:[
 {t:"mc",q:"Chi è Luca?",o:["Un vecchio amico dell'università","Un collega di lavoro","Il cameriere del ristorante"],e:"«Era Luca, un vecchio amico dell'università»."},
 {t:"gap",s:"Mentre ___, è squillato il telefono.",o:["dormivo","ho dormito","dormirò"],e:"Acción en curso interrumpida por otra: mentre + imperfetto."},
 {t:"gap",s:"Da bambino ___ ogni estate al mare.",o:["andavo","sono andato","vado"],e:"Hábito en el pasado (ogni estate) → imperfetto."},
 {t:"gap",s:"Ieri sera ___ un film bellissimo.",o:["ho visto","vedevo","vedrei"],e:"Acción puntual y terminada (ieri sera) → passato prossimo."},
 {t:"order",es:"Mientras comíamos, me habló de su trabajo.",a:["mentre mangiavamo mi ha raccontato del suo lavoro","mi ha raccontato del suo lavoro mentre mangiavamo"],e:"Fondo en imperfetto (mangiavamo) + hecho puntual en passato prossimo (ha raccontato)."}
 ]},
{city:"Venezia",tema:"Pronomi diretti e indiretti",roof:"#ef7d57",
 lesson:{intro:"Los pronombres sustituyen a algo ya nombrado. El directo responde a «¿qué?» o «¿a quién?»; el indirecto lleva la preposición a.",
  tabs:[{h:"Formas",r:[["","Directo","Indirecto"],["io","mi","mi"],["tu","ti","ti"],["lui","lo","gli"],["lei","la","le"],["noi","ci","ci"],["voi","vi","vi"],["loro","li / le","gli"]]},
   {h:"Verbos típicos",r:[["Directo","conoscere, vedere, chiamare, ringraziare, aspettare"],["Indirecto","telefonare a, dire a, offrire a, scrivere a, piacere a"]]}],
  tip:"Con lo, la, li, le el participio concuerda: Le chiavi? Le ho lasciate sul tavolo."},
 pairs:[["Vedo Paolo","lo"],["Vedo Maria","la"],["Leggo i libri","li"],["Scrivo a Paolo","gli"],["Parla a noi","ci"],["Parla a voi","vi"]],
 text:"A Venezia mi sono perso tra i canali, ma non mi è dispiaciuto. Ho chiesto la strada a una signora e lei mi ha accompagnato fino al {ponte|puente} di Rialto. Le ho offerto un caffè per {ringraziarla|darle las gracias}. Poi ho comprato una {maschera|máscara} per mia sorella: gliela darò a Natale. La adorerà!",
 q:[
 {t:"mc",q:"Per chi è la maschera?",o:["Per sua sorella","Per la signora","Per sé stesso"],e:"«Ho comprato una maschera per mia sorella»."},
 {t:"gap",s:"Conosci Paolo? Sì, ___ conosco bene.",o:["lo","gli","le"],e:"Conoscere qualcuno: objeto directo masculino → lo."},
 {t:"gap",s:"Ho telefonato a Maria e ___ ho detto tutto.",o:["le","la","lo"],e:"Dire a qualcuno: objeto indirecto femenino → le."},
 {t:"gap",s:"Le chiavi? ___ ho lasciate sul tavolo.",o:["Le","Li","Gli"],e:"Chiavi es femenino plural → le. Por eso el participio es lasciate."},
 {t:"order",es:"Le invité a un café para darle las gracias.",a:["le ho offerto un caffè per ringraziarla","per ringraziarla le ho offerto un caffè"],e:"Offrire a qualcuno → le (indirecto); ringraziare qualcuno → la (directo)."}
 ]},
{city:"Bologna",tema:"Ci e ne",roof:"#c0392b",
 lesson:{intro:"Ci y ne evitan repetir. Ci suele sustituir un lugar o «a + algo»; ne, una cantidad o «di + algo».",
  tabs:[{h:"CI",r:[["Lugar","Vai a Roma? Sì, ci vado."],["a + cosa","Pensi al lavoro? Ci penso."],["credere a","Non ci credo."],["Existencia","c'è, ci sono"]]},
   {h:"NE",r:[["Cantidad","Quanti ne vuoi? Ne voglio due."],["di + cosa","Parli del film? Ne parlo."],["Una parte","Vuoi del pane? Ne vorrei un po'."]]}],
  tip:"Si hay un número o una cantidad (due, molti, un po'), casi siempre necesitas ne."},
 pairs:[["Vado a Roma","Ci vado"],["Ho due gatti","Ne ho due"],["Penso al viaggio","Ci penso"],["Parlo del film","Ne parlo"],["Credo alla storia","Ci credo"],["Voglio del pane","Ne voglio"]],
 text:"Bologna è la città del buon cibo e ci sono rimasto tre giorni. Al mercato ho visto dei tortellini freschi e ne ho comprati tanti. La signora del {banco|puesto} mi ha detto: «Di {ricette|recetas} ne conosco tante, ma quella della nonna è la migliore». Ci penso ancora: a Bologna ci tornerò di sicuro.",
 q:[
 {t:"mc",q:"Quanto tempo è rimasto a Bologna?",o:["Tre giorni","Una settimana","Un pomeriggio"],e:"«Ci sono rimasto tre giorni»."},
 {t:"gap",s:"Vai spesso in palestra? Sì, ___ vado ogni lunedì.",o:["ci","ne","la"],e:"Ci sustituye a un lugar (in palestra)."},
 {t:"gap",s:"Quanti fratelli hai? ___ ho due.",o:["Ne","Ci","Li"],e:"Ne se usa con cantidades: ne ho due = tengo dos (de ellos)."},
 {t:"gap",s:"Credi all'oroscopo? No, non ___ credo.",o:["ci","ne","lo"],e:"Credere a qualcosa → ci."},
 {t:"spot",s:"Di caffè ci bevo tre al giorno.",w:2,fix:"ne",e:"Con una cantidad (tre) hace falta ne: «ne bevo tre»."}
 ]},
{city:"Firenze",tema:"Futuro e condizionale",roof:"#a7663a",
 lesson:{intro:"El futuro habla de planes y previsiones. El condizionale sirve para pedir con cortesía, aconsejar y expresar deseos.",
  tabs:[{h:"Terminaciones",r:[["","Futuro","Condizionale"],["io","parlerò","parlerei"],["tu","parlerai","parleresti"],["lui / lei","parlerà","parlerebbe"],["noi","parleremo","parleremmo"],["voi","parlerete","parlereste"],["loro","parleranno","parlerebbero"]]},
   {h:"Raíces irregulares (valen para los dos)",r:[["essere","sar-"],["avere","avr-"],["andare","andr-"],["fare","far-"],["potere","potr-"],["volere","vorr-"],["venire","verr-"],["vedere","vedr-"]]}],
  tip:"Quando + futuro: «Quando arriverò, ti chiamerò». En español sería subjuntivo; en italiano no."},
 pairs:[["essere · futuro","sarò"],["avere · futuro","avrò"],["andare · futuro","andrò"],["volere · cond.","vorrei"],["potere · cond.","potrei"],["venire · cond.","verrei"]],
 text:"Domani visiterò gli Uffizi: ho prenotato il {biglietto|entrada} una settimana fa. Mi piacerebbe vedere anche il David, ma non so se avrò tempo. La proprietaria dell'albergo mi ha detto: «Al posto suo, salirei a Piazzale Michelangelo al {tramonto|atardecer}. Vedrà che panorama!». Seguirò il suo consiglio.",
 q:[
 {t:"mc",q:"Che cosa consiglia la proprietaria?",o:["Salire a Piazzale Michelangelo al tramonto","Visitare gli Uffizi di mattina","Prenotare un altro albergo"],e:"«Al posto suo, salirei a Piazzale Michelangelo al tramonto»."},
 {t:"gap",s:"L'anno prossimo ___ in Sicilia.",o:["andremo","andavamo","siamo andati"],e:"L'anno prossimo → futuro: andremo."},
 {t:"gap",s:"___ un caffè, per favore.",o:["Vorrei","Vorrò","Voglia"],e:"Para pedir con cortesía se usa el condizionale: vorrei."},
 {t:"gap",s:"Al posto tuo, io non ___ niente.",o:["direi","dirò","dicevo"],e:"Consejo hipotético (al posto tuo) → condizionale: direi."},
 {t:"gap",s:"Quando ___ grande, farò il medico.",o:["sarò","sarei","ero"],e:"En italiano, quando + futuro (no subjuntivo como en español): quando sarò grande."}
 ]},
{city:"Roma",tema:"Congiuntivo presente",roof:"#d9a441",
 lesson:{intro:"El congiuntivo aparece tras verbos de opinión, deseo, duda o necesidad + che.",
  tabs:[{h:"Presente",r:[["parlare","parli, parli, parli, parliamo, parliate, parlino"],["prendere","prenda, prenda, prenda, prendiamo, prendiate, prendano"],["dormire","dorma, dorma, dorma, dormiamo, dormiate, dormano"]]},
   {h:"Irregulares (io)",r:[["essere","sia"],["avere","abbia"],["andare","vada"],["fare","faccia"],["stare","stia"],["potere","possa"],["venire","venga"]]},
   {h:"Lo activan",r:[["Opinión","penso che, credo che, mi sembra che"],["Deseo","spero che, voglio che"],["Necesidad","bisogna che, è importante che"],["Conjunciones","benché, affinché, prima che"]]}],
  tip:"Las tres personas del singular son iguales; por eso a menudo se dice el sujeto: che io sia, che tu sia."},
 pairs:[["essere","sia"],["avere","abbia"],["andare","vada"],["fare","faccia"],["potere","possa"],["venire","venga"]],
 text:"Roma è caotica, ma credo che sia la città più bella del mondo. Il {tassista|taxista} pensa che i turisti camminino troppo poco: «Bisogna che Lei veda Trastevere a piedi!». Spero che domani non piova, perché voglio che questa giornata sia perfetta. {Benché|Aunque} sia stanco, stasera uscirò di nuovo.",
 q:[
 {t:"mc",q:"Che cosa pensa il tassista?",o:["Che i turisti camminino troppo poco","Che Roma sia troppo cara","Che domani piova"],e:"«Pensa che i turisti camminino troppo poco»."},
 {t:"gap",s:"Penso che Marco ___ ragione.",o:["abbia","ha","avrà"],e:"Pensare che + congiuntivo: abbia."},

function bfs(sx,sy,goal){
  const key=(x,y)=>x+","+y,prev={},q=[[sx,sy]];prev[key(sx,sy)]=null;
  while(q.length){const [x,y]=q.shift();
    if(goal(x,y)){const p=[];let k=key(x,y);while(k){p.unshift(k.split(",").map(Number));k=prev[k]}return p}
    for(const d in DIRS){const nx=x+DIRS[d][0],ny=y+DIRS[d][1],k=key(nx,ny);
      if(k in prev||nx<0||ny<0||nx>=MW||ny>=MH||SOLID.includes(MAP[ny][nx]))continue;
      const e=entAt(nx,ny);if(e&&e.k!=="guide")continue;prev[k]=key(x,y);q.push([nx,ny])}}
  return null;
}
function guideTo(i){
  const f=LEVELS[save.city].tour.at.stops[i],gd=guideEnt();
  const p=bfs(P.x,P.y,(x,y)=>Math.abs(x-f[0])+Math.abs(y-f[1])===1);

}

  const gd=guideEnt(),p=W.p,s=W.s;W.t=Math.min(1,W.t+dt/170);
  const A=s===1?W.g0:p[s-1],B=p[s];
  gd.fx=A[0]+(B[0]-A[0])*W.t;gd.fy=A[1]+(B[1]-A[1])*W.t;gd.dir=dirOf(B[0]-A[0],B[1]-A[1]);gd.wk=W.t>.5?1:0;
  if(s>=2){const a=p[s-2],b=p[s-1];P.fx=a[0]+(b[0]-a[0])*W.t;P.fy=a[1]+(b[1]-a[1])*W.t;P.dir=dirOf(b[0]-a[0],b[1]-a[1]);P.moving=true;P.t=W.t}
  if(W.t>=1){gd.x=B[0];gd.y=B[1];delete gd.fx;delete gd.fy;gd.wk=0;
    if(s>=2){P.x=p[s-1][0];P.y=p[s-1][1];P.fx=P.x;P.fy=P.y;P.step^=1}P.moving=false;
    W.s++;W.t=0;if(W.s>=p.length)arrive()}
}

}

const doneOf=c=>save.done[c]||(save.done[c]=[]);
const need=c=>7;
function buildCity(){
  const c=save.city,L=LEVELS[c],A=L.at;
  MAP=buildMap(L.sp);
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)drawTile(bgx,MAP[y][x],x,y,L);
  if(L.sp.L)LAND[c](bgx,L.sp.L[0]*T,L.sp.L[1]*T,GROUND[L.g][0]);
  const at=(k,p,o)=>({k,x:p[0],y:p[1],o});
  ents=[at("prof",A.prof,{shirt:"#5d275d",hair:"#94b0c2"}),at("arc",A.arc,{shirt:"#ffcd75",hair:"#b13e53"}),at("board",A.board),
        at("capo",A.capo,{shirt:"#29366f",hair:"#333c57",hat:"#29366f"}),at("talk",A.talk,{shirt:"#f4f4e4",hair:"#1a1c2c",hat:"#f4f4e4"}),
        at("quest",A.quest,{shirt:"#257179",hair:"#ffcd75"}),at("chest",A.chest)];
  L.q.forEach((_,i)=>ents.push(Object.assign(at("q",A.q[i],{shirt:SHIRTS[(i+c)%6],hair:HAIRS[(i*2+c)%6]}),{i})));
  L.quest.items.forEach((id,i)=>ents.push(Object.assign(at("item",A.items[i]),{id})));
  ents.push(at("guide",L.tour.at.guide,{shirt:"#ef7d57",hair:"#333c57"}));placeWit();L.tour.at.stops.forEach((p,i)=>ents.push(Object.assign(at("flag",p),{i})));
  Object.assign(P,{x:A.start[0],y:A.start[1],fx:A.start[0],fy:A.start[1],dir:"down",moving:false});
  hud();
}
function hud(){
  const c=save.city,L=LEVELS[c],d=doneOf(c).length,n=need(c);
  const rt=routeOf(c).ids;$("hCity").textContent=(rt.indexOf(c)+1)+"/"+rt.length+" "+L.city.toUpperCase();
  $("hStamps").textContent="PISTE "+Math.min(7,save.clue[c]||0)+"/7";
  $("hHearts").innerHTML=[0,1,2].map(i=>`<span class="${i<save.hearts?"":"off"}">♥</span>`).join("");
  $("goal").textContent=W?"▶ Sigue a la guía…":save.carry?"▶ Llevas "+ITEMS[save.carry][0]+". ¿A quién se lo das?":!save.lesson[c]?"▶ Busca a la Prof, frente a la escuela.":(save.clue[c]||0)<7?"▶ Reúne pistas: habla con todos los que tienen «!».":!save.found[c]?"▶ Resuelve la sopa de letras (botón DOSSIER).":!tourOf(c).done?"▶ Haz el free walking tour con la guía del paraguas amarillo.":"▶ Ve a la estación: el Capotreno te preguntará sobre el tour.";
}
const hidden=e=>e.k==="item"&&(save.carry===e.id||doneOf(save.city).includes("F"))||e.k==="flag"&&(!tourOf(save.city).on||tourOf(save.city).done);
const entAt=(x,y)=>ents.find(e=>e.x===x&&e.y===y&&!hidden(e));
const walk=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&!SOLID.includes(MAP[y][x])&&!entAt(x,y);

let last=0;
function frame(t){
  const dt=Math.max(0,Math.min(50,t-last));last=t;
  if(S.ov==="trip"&&S.phase==="run")tripStep(dt);
  if(W&&!S.ov)stepWalk(dt);
  else if(!S.ov){
    if(P.moving){P.t+=dt/150;
      if(P.t>=1){P.x=P.tx;P.y=P.ty;P.fx=P.x;P.fy=P.y;P.moving=false;P.step^=1}
      else{P.fx=P.x+(P.tx-P.x)*P.t;P.fy=P.y+(P.ty-P.y)*P.t}}
    if(!P.moving){let d=STEPQ||["up","down","left","right"].find(k=>held[k]&&performance.now()-(HT[k]||0)>260);STEPQ=null;
      if(d)AUTO=null;else if(AUTO){if(AUTO.length){const n=AUTO.shift();d=dirOf(n[0]-P.x,n[1]-P.y)}else{AUTO=null;AUTOD=null;if(AUTOT){P.dir=dirOf(AUTOT.x-P.x,AUTOT.y-P.y);AUTOT=null;interact()}}}
      if(d){P.dir=d;const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];if(walk(nx,ny)){P.tx=nx;P.ty=ny;P.t=0;P.moving=true}else{AUTO=null;AUTOD=null}}}
  }
  const cx=Math.round(Math.max(0,Math.min(MW*T-VW*T,P.fx*T-VW*T/2+8))),cy=Math.round(Math.max(0,Math.min(MH*T-VH*T,P.fy*T-VH*T/2+8)));
  camX=cx;camY=cy;g.drawImage(bg,-cx,-cy);
  const c=save.city,d=doneOf(c);
  const list=ents.filter(e=>!hidden(e)).concat([{k:"me",x:P.fx,y:P.fy}]).sort((a,b)=>a.y-b.y);
  for(const e of list){const x=Math.round((e.fx??e.x)*T)-cx,y=Math.round((e.fy??e.y)*T)-cy;
    if(e.k==="me"){drawChar(g,x,y,{shirt:"#b13e53",hair:"#5d3a1a",hat:"#b13e53"},P.dir,P.moving&&P.t>.5?1:P.step);if(save.carry)drawItem(g,save.carry,x,y-13)}
    else if(e.k==="board")drawBoard(g,x,y);
    else if(e.k==="chest")drawChest(g,x,y,save.cards[c]);
    else if(e.k==="item")drawItem(g,e.id,x,y);
    else if(e.k==="flag")drawFlag(g,x,y,tourOf(c).seen.includes(e.i));
    else{drawChar(g,x,y,e.o,e.dir||"down",e.wk||0);
      if(e.k==="q")mark(g,x,y,d.includes(e.i));
      else if(e.k==="talk")mark(g,x,y,d.includes("D"));
      else if(e.k==="quest")mark(g,x,y,d.includes("F"));
      else if(e.k==="wit")mark(g,x,y,d.includes("I"));
      else if(e.k==="chainC"&&(save.chain||{})[c]===2)mark(g,x,y,false);
      else if(e.k==="prof"){drawProfMarks(g,x,y,e,c);if(!save.lesson[c])mark(g,x,y,false)}
      else if(e.k==="capo"&&save.found[c]&&tourOf(c).done)mark(g,x,y,false);
      else if(e.k==="guide"){R(g,x+13,y-3,1,13,"#1a1c2c");R(g,x+9,y-6,9,3,"#ffcd75");R(g,x+11,y-8,5,2,"#ffcd75")}}}
  drawPtr(cx,cy,dt);
  requestAnimationFrame(frame);
}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const stars=n=>[0,1,2].map(i=>`<span class="star${i<n?"":" off"}">★</span>`).join("");
const passage=t=>esc(t).replace(/\{([^|]+)\|([^}]+)\}/g,(m,w,tr)=>`<span class="gl" data-w="${w}" data-tr="${tr}">${w}</span>`);
const btn=(label,attr,cls)=>`<button class="pbtn ${cls===undefined?"go":cls}" ${attr}>${label}</button>`;
function show(v,o){clearTimeout(tm);S=Object.assign({ov:v},o||{});for(const k in held)held[k]=false;render()}
function hide(){clearTimeout(tm);S={ov:null};render();hud()}

function lose(){const c=save.city;save.hearts--;save.miss[c]=(save.miss[c]||0)+1;persist();hud()}
function dead(){
  if(save.hearts>0)return false;
  const c=save.city,A=LEVELS[c].at;save.done[c]=[];save.miss[c]=0;save.hearts=3;save.carry=null;persist();
  Object.assign(P,{x:A.start[0],y:A.start[1],fx:A.start[0],fy:A.start[1],dir:"down",moving:false});
  say("Sin vidas","Te has quedado sin vidas y pierdes los sellos de "+LEVELS[c].city+". Repasa el Quaderno y vuelve a intentarlo. Consejo: en la sala giochi recuperas vidas.");

}

const hp=()=>`<span class="hp">${"♥".repeat(Math.max(0,save.hearts))}</span>`;

function answer(ok,sol){

}

function interact(){
  if(S.ov||P.moving||W)return;
  const e=entAt(P.x+DIRS[P.dir][0],P.y+DIRS[P.dir][1]);if(!e)return;
  const c=save.city,L=LEVELS[c],d=doneOf(c),n=need(c),noProf="Prima parla con la Prof! Primero habla con la Prof, frente a la escuela.";

  else if(e.k==="talk"){
    if(!save.lesson[c])say(L.dial.who,noProf);
    else if(d.includes("D"))say(L.dial.who,"È stato un piacere! Ya tienes mi sello.");

  else if(e.k==="quest"){const Q=L.quest;

    else if(save.carry===Q.want){d.push("F");save.carry=null;persist();hud();say("Vecino","<span class='it'>Perfetto, "+esc(ITEMS[Q.want][0])+"! Grazie mille.</span><br><b>+1 pista</b>",btn("CONTINUAR","data-chk"))}
    else{const it=ITEMS[save.carry][0];save.carry=null;persist();say("Vecino","<span class='it'>No, "+esc(it)+" non mi serve!</span><br><span class='mute'>El objeto vuelve a su sitio. Habla otra vez con él para releer lo que busca.</span>")}}
  else if(e.k==="wit"){
    if(!save.lesson[c])say("Testimone",noProf);
    else if(d.includes("I"))say("Testimone","Spero che lo prendiate presto! Ya tienes mi identikit.");
    else startIdk()}
  else if(e.k==="guide"){const t=tourOf(c);
    if(t.done)say("Guida","Grazie per la mancia! El tour solo se hace una vez: tus apuntes están en el Quaderno. Recuerda que el Capotreno te preguntará sobre él.");
    else{if(!t.on){t.on=true;persist()}say("Guida","<span class='it'>Benvenuti al free walking tour di "+L.city+"! Seguitemi!</span><br>Te llevo a tres lugares y te cuento su historia. Presta atención: antes de subir al tren, el Capotreno te preguntará sobre ellos.",btn("¡VAMOS!","data-walk"))}}
  else if(e.k==="flag")show("stop",{i:e.i,tr:false});
  else if(e.k==="q"){
    if(!save.lesson[c])say("Vecino",noProf);
    else if(d.includes(e.i))say("Vecino","Bravo! Ya tienes mi sello.");
    else startQ(e.i)}
  else if(e.k==="capo"){
    if((save.clue[c]||0)<7)return say("Capotreno","Biglietto, prego! Primero reúne las 7 pistas de "+L.city+" (llevas "+(save.clue[c]||0)+").");
    if(!save.found[c])return say("Capotreno","¿Adónde quieres ir? Primero descubre adónde ha ido el ladrón: resuelve la sopa de letras desde el DOSSIER.");
    if(!tourOf(c).done)return say("Capotreno","Biglietto, prego! Prima di partire ti faccio tre domande sul free walking tour. Habla con la guía del paraguas amarillo y haz el tour.");
    show("exam",{k:0,wrong:[],opts:shuffle([0,1,2]),pick:-1});
  }
}

/* ---------- sopa de letras ---------- */
function makeSopa(words){
  const N=9,AB="ABCDEFGILMNOPRSTUVZ";
  for(let tries=0;tries<300;tries++){
    const g=Array(N*N).fill(""),place=[];let ok=true;
    for(const w of words){let done=false;
      for(let t=0;t<300&&!done;t++){const d=[[1,0],[0,1],[1,1]][Math.floor(Math.random()*3)];
        const x0=Math.floor(Math.random()*(N-(d[0]?w.length-1:0))),y0=Math.floor(Math.random()*(N-(d[1]?w.length-1:0)));
        let fits=true;for(let i=0;i<w.length;i++){const k=(y0+d[1]*i)*N+x0+d[0]*i;if(g[k]&&g[k]!==w[i]){fits=false;break}}
        if(fits){const cells=[];for(let i=0;i<w.length;i++){const k=(y0+d[1]*i)*N+x0+d[0]*i;g[k]=w[i];cells.push(k)}place.push(cells);done=true}}
      if(!done){ok=false;break}}
    if(ok){for(let i=0;i<g.length;i++)if(!g[i])g[i]=AB[Math.floor(Math.random()*AB.length)];return {g,place}}
  }
}
function startSopa(){const c=save.city,w=caseOf(c).cities[c].sopa,m=makeSopa(w);show("sopa",{g:m.g,place:m.place,words:w,found:[],sel:-1})}
function sopaTap(i){
  if(S.found.length===S.words.length)return;
  if(S.sel<0||S.sel===i){S.sel=S.sel===i?-1:i;return render()}
  const N=9,ax=S.sel%N,ay=Math.floor(S.sel/N),bx=i%N,by=Math.floor(i/N),dx=Math.sign(bx-ax),dy=Math.sign(by-ay),n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));
  S.sel=-1;
  if(ax===bx||ay===by||Math.abs(bx-ax)===Math.abs(by-ay)){
    const line=[];for(let k=0;k<=n;k++)line.push((ay+dy*k)*N+ax+dx*k);
    S.place.forEach((p,wi)=>{if(S.found.includes(wi)||p.length!==line.length)return;
      if(p.every((v,k)=>v===line[k])||p.every((v,k)=>v===line[line.length-1-k])){S.found.push(wi);speak(S.words[wi].toLowerCase())}});
  }
  if(S.found.length===S.words.length){const c=save.city;save.found[c]=1;persist();hud();
    const nx=nextOf(c);speak(nx===undefined?caseOf(c).ending:destLine(c))}
  render();
}
const destLine=c=>(caseOf(c).woman?"La ladra è andata a ":"Il ladro è andato a ")+LEVELS[nextOf(c)].city+"!";

  const c=save.city,cs=caseOf(c),fc=new Set(S.found.flatMap(wi=>S.place[wi])),done=S.found.length===S.words.length,last=nextOf(c)===undefined;

  const words=`<p class="words">${S.words.map((w,wi)=>S.found.includes(wi)?`<s>${w}</s>`:"?".repeat(w.length)).join(" · ")}</p>`;
  if(done)return `<div class="eyebrow">Sopa de letras · ${esc(cs.title)}</div>${grid}${words}`+(last

function placeWit(){
  const A=LEVELS[save.city].at,occ=new Set(ents.map(e=>e.x+","+e.y)),seen=new Set([A.start[0]+","+A.start[1]]),q=[[A.start[0],A.start[1],0]];
  const open=(x,y)=>!SOLID.includes(MAP[y][x])&&MAP[y][x]!=="="&&!occ.has(x+","+y);
  while(q.length){const [x,y,d]=q.shift();
    if(d>=5&&open(x,y)&&Object.values(DIRS).every(([dx,dy])=>open(x+dx,y+dy))){ents.push({k:"wit",x,y,o:{shirt:"#5d275d",hair:"#c5d3dc",hat:"#566c86"}});return}
    for(const [dx,dy] of Object.values(DIRS)){const nx=x+dx,ny=y+dy,k=nx+","+ny;if(seen.has(k)||SOLID.includes(MAP[ny][nx]))continue;seen.add(k);q.push([nx,ny,d+1])}}
}

let DOORS=[];
function makeDoors(c){
  const L=LEVELS[c],pr=ents.find(e=>e.k==="prof"),cp=ents.find(e=>e.k==="capo"),dist=(d,e)=>Math.abs(d.x-e.x)+Math.abs(d.y-e.y);
  const ds=L.sp.h.map(([x,y,w,s])=>({x:x+(w>>1),y:y+2,hx:x,hy:y,w,big:!!s}));
  const big=ds.filter(d=>d.big),st=(big.length?big:ds).slice().sort((a,b)=>dist(a,cp)-dist(b,cp))[0];
  const sc=ds.filter(d=>d!==st).sort((a,b)=>dist(a,pr)-dist(b,pr))[0];
  let k=0;ds.forEach(d=>{d.type=d===st?"station":d===sc?"school":SHOPK[(c*3+k++)%SHOPK.length]});
  return ds;
}

  for(const d of DOORS){const fx=d.x,fy=d.y+1,e=ents.find(e=>e.x===fx&&e.y===fy);if(!e)continue;

    if(spot){e.x=spot[0];e.y=spot[1];if(e.k==="guide")e.home=spot}}
}

function newOrder(type){
  const sh=SHOPS[type],s=stage(),n=s===0?2:3,idx=shuffle(sh.it.map((_,i)=>i)).slice(0,n),want={};
  idx.forEach(i=>want[i]=1+Math.floor(Math.random()*(s===0?2:3)));
  const parts=idx.map(i=>{const it=sh.it[i],q=want[i];return q===1?(it[2]==="un'"?"un'"+it[0]:it[2]+" "+it[0]):(q===2?"due ":"tre ")+it[1]});
  const list=parts.length>1?parts.slice(0,-1).join(", ")+" e "+parts[parts.length-1]:parts[0];
  const tpl=pick(s<2?["Buongiorno! Vorrei {L}, per favore.","Mi dà {L}, per favore?","Per me {L}, grazie.","Salve! Prendo {L}."]:["Buongiorno! Mi servirebbero {L}, se possibile.","Avrei bisogno di {L}, grazie.","Mi potrebbe dare {L}?"]);
  return {want,txt:tpl.replace("{L}",list)};
}

function capoTalk(){
  const c=save.city,L=LEVELS[c],k=save.clue[c]||0,hi=pick(LINES.capoHi);

/* ---------- interacción ---------- */
function interact(){
  if(S.ov||P.moving||W)return;
  const fx=P.x+DIRS[P.dir][0],fy=P.y+DIRS[P.dir][1],e=entAt(fx,fy);
  if(!e){const dr=houseAt(fx,fy,1);if(dr)enterDoor(dr);return}
  const c=save.city,L=LEVELS[c],d=doneOf(c),np=who=>sayL(who,pick(LINES.noProf),"Primero habla con la Prof, en la escuela (cartel verde).");
  if(e.k==="prof"){save.lesson[c]=1;persist();hud();show("lesson")}
  else if(e.k==="board")show("text");
  else if(e.k==="arc")show("arc");
  else if(e.k==="chest")startChest();
  else if(e.k==="item"){save.carry=e.id;persist();hud();sayL("Oggetto","Hai preso "+ITEMS[e.id][0]+".","("+ITEMS[e.id][1]+") Llévaselo a quien lo necesite. Si coges otro objeto, este vuelve a su sitio.")}
  else if(e.k==="talk"){if(!save.lesson[c])np(L.dial.who);else if(d.includes("D"))sayL(L.dial.who,pick(LINES.talkDone),"Ya tienes su pista.");else startDial()}
  else if(e.k==="quest"){const Q=L.quest;
    if(d.includes("F"))sayL("Vicino",pick(LINES.questDone),"Ya tienes su pista.");
    else if(!save.carry)sayL("Vicino",Q.ask,"Hay tres objetos por la ciudad. Escucha bien qué necesita y tráeselo.");
    else if(save.carry===Q.want){d.push("F");save.carry=null;persist();hud();sayL("Vicino","Perfetto, "+ITEMS[Q.want][0]+"! Grazie mille.","+1 pista",btn("CONTINUAR","data-chk"))}
    else{const it=ITEMS[save.carry][0];save.carry=null;persist();hud();sayL("Vicino","No, "+it+" non mi serve!","El objeto vuelve a su sitio. Vuelve a escuchar lo que busca.")}}
  else if(e.k==="wit"){if(!save.lesson[c])np("Testimone");else if(d.includes("I"))sayL("Testimone",pick(LINES.witDone),"Ya tienes su identikit.");else startIdk()}
  else if(e.k==="guide"){const t=tourOf(c);
    if(t.done)sayL("Guida",pick(LINES.guideDone),"El tour solo se hace una vez: tus apuntes están en el Quaderno.");
    else{if(!t.on){t.on=true;persist()}sayL("Guida","Benvenuti al free walking tour di "+L.city+"! Seguitemi!","Te llevo a tres lugares. Presta atención: el Capotreno te preguntará sobre ellos y el tour solo se hace una vez.",btn(trp("¡VAMOS!","ANDIAMO!"),"data-walk"))}}
  else if(e.k==="flag")show("stop",{i:e.i,tr:false});
  else if(e.k==="q"){const q=L.q[e.i];
    if(!save.lesson[c])np("Vicino");
    else if(d.includes(e.i))sayL("Vicino",pick(LINES.doneQ),"Ya tienes su pista.");
    else if(q.t==="mc"&&!save.read[c])sayL("Vicino",pick(LINES.needRead),"Su pregunta es sobre el cartel de la plaza: léelo primero.");
    else sayL("Vicino",pick(LINES.greetQ),"",btn(trp("¡ADELANTE!","AVANTI!"),"data-sq="+e.i)+btn(trp("AHORA NO","NON ADESSO"),"data-close",""))}
  else if(e.k==="capo")capoTalk();
}

function sopaTap(i){
  if(S.found.length===S.words.length)return;
  if(S.sel<0||S.sel===i){S.sel=S.sel===i?-1:i;return render()}
  const N=9,ax=S.sel%N,ay=Math.floor(S.sel/N),bx=i%N,by=Math.floor(i/N),dx=Math.sign(bx-ax),dy=Math.sign(by-ay),n=Math.max(Math.abs(bx-ax),Math.abs(by-ay));
  S.sel=-1;
  if(ax===bx||ay===by||Math.abs(bx-ax)===Math.abs(by-ay)){const line=[];for(let k=0;k<=n;k++)line.push((ay+dy*k)*N+ax+dx*k);
    S.place.forEach((p,wi)=>{if(S.found.includes(wi)||p.length!==line.length)return;
      if(p.every((v,k)=>v===line[k])||p.every((v,k)=>v===line[line.length-1-k])){S.found.push(wi);persist();speak(S.words[wi].toLowerCase())}})}
  if(S.found.length===S.words.length){const c=save.city;puzzleDone(c);speak(nextOf(c)===undefined?caseOf(c).ending:destLine(c))}
  render();
}

const CWDEF={
 TRENTO:"Città del Trentino con un grande castello.",CASTELLO:"Edificio antico con torri: lì vivevano i principi.",LAGO:"Acqua dolce tra le montagne: non è il mare.",
 PERUGIA:"Capoluogo dell'Umbria, città dei Baci.",UMBRIA:"Regione verde nel centro d'Italia, senza mare.",BACI:"Cioccolatini con un messaggio d'amore.",
 MOLO:"Dove si fermano le navi nel porto.",TRAGHETTO:"Nave che porta persone e macchine.",MAPPA:"L'oggetto rubato dal museo di Aosta.",

};
function tryCw(ws){
  const cells=new Map(),placed=[],key=(x,y)=>x+","+y;
  const put=(w,x,y,dir)=>{for(let i=0;i<w.length;i++)cells.set(key(x+(dir?0:i),y+(dir?i:0)),w[i]);placed.push({w,x,y,dir})};
  const can=(w,x,y,dir)=>{const dx=dir?0:1,dy=dir?1:0;if(cells.has(key(x-dx,y-dy))||cells.has(key(x+dx*w.length,y+dy*w.length)))return false;let cross=0;
    for(let i=0;i<w.length;i++){const X=x+dx*i,Y=y+dy*i,ch=cells.get(key(X,Y));if(ch!==undefined){if(ch!==w[i])return false;cross++;continue}
      if(cells.has(key(X+dy,Y+dx))||cells.has(key(X-dy,Y-dx)))return false}
    return cross>0};
  put(ws[0],0,0,0);
  for(const w of ws.slice(1)){let ok=false;
    out:for(const p of placed)for(let i=0;i<p.w.length;i++)for(let j=0;j<w.length;j++){if(w[j]!==p.w[i])continue;const dir=p.dir?0:1,X=p.x+(p.dir?0:i)-(dir?0:j),Y=p.y+(p.dir?i:0)-(dir?j:0);
      if(can(w,X,Y,dir)){put(w,X,Y,dir);ok=true;break out}}
    if(!ok)return null}
  return placed;
}
function makeCw(words){
  let pl=null;for(const pm of [[0,1,2],[1,0,2],[2,0,1],[0,2,1],[1,2,0],[2,1,0]]){pl=tryCw(pm.map(i=>words[i]));if(pl)break}
  if(!pl)pl=words.map((w,i)=>({w,x:0,y:i*2,dir:0}));
  const mx=Math.min(...pl.map(p=>p.x)),my=Math.min(...pl.map(p=>p.y));pl.forEach(p=>{p.x-=mx;p.y-=my});
  const W=Math.max(...pl.map(p=>p.x+(p.dir?1:p.w.length))),H=Math.max(...pl.map(p=>p.y+(p.dir?p.w.length:1)));
  pl.sort((a,b)=>a.y-b.y||a.x-b.x);let n=0;const nums={};pl.forEach(p=>{const k=p.x+","+p.y;p.num=nums[k]||(nums[k]=++n)});
  return {W,H,words:pl};
}
function startCw(){const c=save.city,cd=caseOf(c).cities[c];let z=save.puz[c];
  if(!z||!z.cw){z=save.puz[c]={cw:makeCw(cd.sopa),solved:[]};persist()}
  show("cw",{cw:z.cw,solved:z.solved,cs:-1,msg:""})}
function cwHtml(){
  const c=save.city,cw=S.cw,cell={},rev=new Set();
  cw.words.forEach((p,wi)=>{for(let i=0;i<p.w.length;i++){const k=(p.x+(p.dir?0:i))+","+(p.y+(p.dir?i:0));cell[k]=p.w[i];if(S.solved.includes(wi))rev.add(k)}});
  const starts={};cw.words.forEach(p=>starts[p.x+","+p.y]=p.num);
  let g="";for(let y=0;y<cw.H;y++)for(let x=0;x<cw.W;x++){const k=x+","+y;g+=cell[k]?`<span class="cwc${rev.has(k)?" r":""}">${starts[k]?`<small>${starts[k]}</small>`:""}${rev.has(k)?cell[k]:""}</span>`:`<span class="cwc x"></span>`}
  const done=S.solved.length===cw.words.length;
  const grid=`<div class="cw" style="grid-template-columns:repeat(${cw.W},1fr);max-width:${Math.min(100,cw.W*11)}%">${g}</div>`;
  if(done)return `<div class="eyebrow">${trp("Crucigrama","Cruciverba")}</div>${grid}${doneHtml(c)}`;
  const clues=cw.words.map((p,wi)=>`<button class="opt${S.solved.includes(wi)?" ok":""}" data-cwsel="${wi}" ${S.solved.includes(wi)?"disabled":""} style="${S.cs===wi?"outline:3px solid var(--blue)":""}"><b>${p.num} ${p.dir?"↓":"→"}</b> ${esc(CWDEF[p.w]||"")} (${p.w.length})${S.solved.includes(wi)?" · "+p.w:""}</button>`).join("");
  const inp=S.cs>=0?`<div class="row"><input id="cwin" class="cwin" maxlength="${cw.words[S.cs].w.length}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="${"_".repeat(cw.words[S.cs].w.length)}" aria-label="Palabra">${btn("OK","data-cwok","")}</div>${S.msg?`<p class="mute">${S.msg}</p>`:""}`:"";

}

    for(const [dx,dy] of Object.values(DIRS)){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(k in prev||!walk(nx,ny))continue;prev[k]=key(x,y);q.push([nx,ny])}}
  if(!end)return;
  const path=[];let k=key(end[0],end[1]);while(k&&k!==key(sx,sy)){path.unshift(k.split(",").map(Number));k=prev[k]}

function clearDoors(){
  const fronts=new Set(DOORS.map(d=>d.x+","+(d.y+1))),A=LEVELS[save.city].at;
  const free=(x,y)=>x>0&&y>0&&x<MW-1&&y<MH-1&&!SOLID.includes(MAP[y][x])&&MAP[y][x]!=="="&&!ents.some(e=>e.x===x&&e.y===y)&&!fronts.has(x+","+y)&&!(x===A.start[0]&&y===A.start[1]);
  for(const d of DOORS){const fx=d.x,fy=d.y+1,e=ents.find(e=>e.x===fx&&e.y===fy);if(!e)continue;
    const spot=[[fx-1,fy],[fx+1,fy],[fx-2,fy],[fx+2,fy],[fx,fy+1],[fx-1,fy+1],[fx+1,fy+1]].find(([x,y])=>free(x,y));
    if(spot){e.x=spot[0];e.y=spot[1];if(e.k==="guide")e.home=spot}}
  if(isLast(save.city)){const cp=ents.find(e=>e.k==="capo");if(cp)cp.o=FP[caseOf(save.city).id].look}
  fixBlocks();
}
function fixBlocks(){
  const A=LEVELS[save.city].at,fronts=new Set(DOORS.map(d=>d.x+","+(d.y+1))),key=(x,y)=>x+","+y;
  const open=(x,y)=>x>0&&y>0&&x<MW-1&&y<MH-1&&!SOLID.includes(MAP[y][x]);
  const reach=skip=>{const occ=new Set(ents.filter(e=>e!==skip).map(e=>key(e.x,e.y))),seen=new Set([key(A.start[0],A.start[1])]),q=[A.start];
    while(q.length){const [x,y]=q.pop();for(const [dx,dy] of Object.values(DIRS)){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(!seen.has(k)&&open(nx,ny)&&!occ.has(k)){seen.add(k);q.push([nx,ny])}}}return seen};
  for(const e of ents){if(e.k==="flag")continue;
    const onPath=",=".includes(MAP[e.y][e.x]),without=reach(e),blocks=reach(null).size<without.size-1;
    if(!onPath&&!blocks)continue;
    const cand=[];for(let r=1;r<=3;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.abs(dx)+Math.abs(dy)!==r)continue;const x=e.x+dx,y=e.y+dy;
      if(!open(x,y)||",=".includes(MAP[y][x])||fronts.has(key(x,y))||(x===A.start[0]&&y===A.start[1])||ents.some(o=>o!==e&&o.x===x&&o.y===y))continue;cand.push([x,y])}
    const ox=e.x,oy=e.y;let ok=false;
    for(const [x,y] of cand){e.x=x;e.y=y;const r2=reach(null);
      if(r2.size>=without.size-1&&Object.values(DIRS).some(([dx,dy])=>r2.has(key(x+dx,y+dy)))){ok=true;if(e.k==="guide")e.home=[x,y];break}}
    if(!ok){e.x=ox;e.y=oy}}
}

function hintLines(c,w,n,max){const out=[],wh=WHINT[w],s=stage();

  return steps.slice(0,Math.min(n,max))}
function puzHelp(c,words,solved,labels){

  const rows=words.map((w,wi)=>{if(solved.includes(wi))return "";const n=hintSteps(c,w),ls=hintLines(c,w,n,max),left=hintAvail(c,w)-n;

  return clues+`<details class="pg aid"${S.aidOpen?" open":""}><summary><b>💡 ${trp("Ayudas","Aiuti")}</b><span class="pgt">${trp("hasta","fino a")} ${hintAvail(c,words[0])} ${trp("por palabra","per parola")}</span></summary><div class="pgb">${rows}</div></details>`}
