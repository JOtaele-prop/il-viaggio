/* ================= v24: cada pista la cuenta un testigo, con su pequeña historia ================= */
const CSTORY={
 14:[["Custode del museo","Ieri ho aperto il Tempio Voltiano alle nove. Un signore è entrato due volte e ha guardato solo la vetrina della pila, per tanto tempo. Strano, no?","Ayer abrí el Tempio Voltiano a las nueve. Un señor entró dos veces y miró solo la vitrina de la pila, mucho rato. Raro, ¿no?"],
  ["Guida del museo","Io faccio le visite guidate. Ieri nel gruppo c'era un uomo alto e simpatico: faceva tante domande sull'elettricità.","Yo hago las visitas guiadas. Ayer en el grupo había un hombre alto y simpático: hacía muchas preguntas sobre la electricidad."],
  ["Signora del bar","Stamattina pulivo il bar davanti al museo e ho trovato un foglio per terra. C'era scritto: «La pila di Volta ha più di duecento anni. Vale moltissimo!» Forse è del ladro…","Esta mañana limpiaba el bar delante del museo y encontré una hoja en el suelo. Ponía: «La pila de Volta tiene más de doscientos años. ¡Vale muchísimo!» Quizá es del ladrón…"],
  ["Autista dell'autobus","Io guido l'autobus. Ieri sera un signore alto mi ha chiesto il biglietto per una città vicina. Il nome? Comincia con la B, ricordo solo questo.","Yo conduzco el autobús. Ayer por la tarde un señor alto me pidió un billete a una ciudad cercana. ¿El nombre? Empieza por B, solo recuerdo eso."],
  ["Fioraia","Un signore ha comprato una rosa nel mio negozio e mi ha detto: «Domani cammino sulle antiche pareti di pietra intorno a una città. Che emozione!»","Un señor compró una rosa en mi tienda y me dijo: «Mañana camino sobre las antiguas paredes de piedra que rodean una ciudad. ¡Qué emoción!»"],
  ["Studente","Ero al lago e un signore leggeva una guida. Mi ha detto: «Lì c'è una funicolare che sale in cima alla collina, nella parte più antica della città!»","Estaba en el lago y un señor leía una guía. Me dijo: «¡Allí hay un funicular que sube a lo alto de la colina, a la parte más antigua de la ciudad!»"],
  ["Pescatore","Ieri pescavo al porto e un signore mi ha mostrato una cartolina: una città divisa in due, una parte su in collina e una parte giù in pianura.","Ayer pescaba en el puerto y un señor me enseñó una postal: una ciudad dividida en dos, una parte arriba en la colina y otra abajo en la llanura."]],
 15:[["Cuoca","Lavoro in una trattoria in collina. Ieri un signore ha mangiato tre piatti di polenta! Aveva con sé una scatola e non la lasciava mai.","Trabajo en una trattoria en la colina. ¡Ayer un señor comió tres platos de polenta! Llevaba una caja y no la soltaba nunca."],
  ["Bigliettaio della funicolare","Io vendo i biglietti della funicolare. Ieri un uomo ha pagato con la carta: sullo scontrino c'era il suo nome, Bruno Galli.","Yo vendo los billetes del funicular. Ayer un hombre pagó con tarjeta: en el tique estaba su nombre, Bruno Galli."],
  ["Bigliettaio della funicolare","Quel Bruno era molto allegro. Mi ha detto: «Ho una scatola molto speciale, sono felice!» e la teneva stretta stretta.","Ese Bruno estaba muy alegre. Me dijo: «¡Tengo una caja muy especial, estoy feliz!» y la apretaba fuerte."],
  ["Signora in stazione","Ero in fila alla stazione, dietro a un signore con una scatola. Ha chiesto un treno per la città di Romeo e Giulietta.","Estaba en la cola de la estación, detrás de un señor con una caja. Pidió un tren a la ciudad de Romeo y Julieta."],
  ["Ragazza al bar","Al bar un signore leggeva una guida e sorrideva: «Voglio vedere il balcone di Giulietta. Romeo e Giulietta si volevano tanto bene!»","En el bar un señor leía una guía y sonreía: «Quiero ver el balcón de Julieta. ¡Romeo y Julieta se querían muchísimo!»"],
  ["Musicista","Io suono la chitarra in piazza. Un signore mi ha detto: «Domani sera vado all'opera, in un grande anfiteatro romano!»","Yo toco la guitarra en la plaza. Un señor me dijo: «¡Mañana por la noche voy a la ópera, en un gran anfiteatro romano!»"],
  ["Pulitore della stazione","Ho trovato un biglietto del treno per terra, un po' rotto. Si leggeva solo: «Bergamo → V _ _ _ _ A».","Encontré un billete de tren en el suelo, un poco roto. Solo se leía: «Bergamo → V _ _ _ _ A»."]],
 16:[["Gelataio","Ho un chiosco davanti all'anfiteatro. Ieri un signore ha preso un gelato al cioccolato e guardava sempre dentro una scatola.","Tengo un quiosco delante del anfiteatro. Ayer un señor tomó un helado de chocolate y miraba todo el rato dentro de una caja."],
  ["Gelataio","Abbiamo parlato un po': si chiama Bruno, ha 35 anni e fa l'elettricista. Gli piacciono le pile e le batterie… che strano!","Hablamos un poco: se llama Bruno, tiene 35 años y es electricista. Le gustan las pilas y las baterías… ¡qué raro!"],
  ["Cameriere","Servivo un caffè e ho sentito un signore al telefono: «Domani sera vendo la pila a un collezionista!» Poi ha visto me e ha chiuso subito.","Servía un café y oí a un señor al teléfono: «¡Mañana por la noche vendo la pila a un coleccionista!» Luego me vio y colgó enseguida."],
  ["Bigliettaia","Io lavoro alla stazione. Un signore mi ha chiesto: «Un treno per la città con l'università più antica di qui, per favore.»","Yo trabajo en la estación. Un señor me pidió: «Un tren a la ciudad con la universidad más antigua de por aquí, por favor.»"],
  ["Studentessa","Ero in treno con un signore simpatico. Mi ha detto: «Domani bevo un caffè in un caffè storico, famoso in tutta Italia.»","Iba en el tren con un señor simpático. Me dijo: «Mañana tomo un café en un café histórico, famoso en toda Italia.»"],
  ["Fotografo","Un signore ha guardato le mie foto e mi ha chiesto di Prato della Valle: uno spazio enorme in mezzo alla città, con statue e un canale.","Un señor miró mis fotos y me preguntó por Prato della Valle: un espacio enorme en medio de la ciudad, con estatuas y un canal."],
  ["Controllore","Ho controllato il biglietto di un signore con una scatola. C'era scritto: «Verona → P _ _ _ _ A».","Revisé el billete de un señor con una caja. Ponía: «Verona → P _ _ _ _ A»."]],
 17:[["Edicolante","Bruno ha comprato un giornale da me. Mi ha detto: «Stasera aspetto un collezionista in un caffè storico.»","Bruno me compró un periódico. Me dijo: «Esta noche espero a un coleccionista en un café histórico.»"],
  ["Edicolante","Era nervoso e parlava tanto: «Il collezionista mi paga molto per l'oggetto della scatola. Poi sono ricco!» Ecco il suo movente.","Estaba nervioso y hablaba mucho: «El coleccionista me paga mucho por el objeto de la caja. ¡Luego soy rico!» Ese es su móvil."],
  ["Signora con il cane","Il mio cane ha trovato un biglietto vicino a una panchina. C'è il disegno di una volpe e dice: «Il collezionista arriverà. La Volpe». Chi è questa Volpe?","Mi perro encontró una nota junto a un banco. Tiene el dibujo de un zorro y dice: «El coleccionista vendrá. La Volpe». ¿Quién es esa Volpe?"],
  ["Barbiere","Ho tagliato i capelli a un signore con una scatola. Ha detto: «Ho un appuntamento importante alle otto di sera.»","Le corté el pelo a un señor con una caja. Dijo: «Tengo una cita importante a las ocho de la tarde.»"],
  ["Professore","Esco dall'università e vedo un signore con una scatola. Mi chiede: «Dov'è il caffè storico qui vicino?» Gli ho indicato la strada.","Salgo de la universidad y veo a un señor con una caja. Me pregunta: «¿Dónde está el café histórico aquí cerca?» Le indiqué el camino."],
  ["Nonno","Da giovane ci andavo sempre, in quel caffè. Lo chiamavamo «il caffè senza porte», perché era aperto giorno e notte!","De joven iba siempre a ese café. Lo llamábamos «el café sin puertas», ¡porque estaba abierto día y noche!"],
  ["Ragazzo","Il signore con la scatola mi ha chiesto il nome del caffè. Non lo ricordava bene: «Comincia con la P e finisce con «-occhi»…»","El señor de la caja me preguntó el nombre del café. No lo recordaba bien: «Empieza por P y termina en «-occhi»…»"]],
 8:[["Cameriere","Ieri sera nel mio ristorante una signora ha mangiato una fonduta enorme. Aveva un rotolo di carta sotto il braccio e non lo lasciava mai.","Anoche en mi restaurante una señora se comió una fondue enorme. Llevaba un rollo de papel bajo el brazo y no lo soltaba nunca."],
  ["Cameriera","L'ho vista bene: è una donna, non un uomo! Capelli lunghi e una giacca blu.","La vi bien: ¡es una mujer, no un hombre! Pelo largo y una chaqueta azul."],
  ["Cameriera","Ha aperto il rotolo sul tavolo: era una carta antica. L'ha toccata e ha detto piano: «Nonno, finalmente!»","Abrió el rollo sobre la mesa: era un mapa antiguo. Lo tocó y dijo bajito: «¡Abuelo, por fin!»"],
  ["Bigliettaio","In stazione la signora mi ha chiesto un treno per la costa: «Voglio vedere le onde e la spiaggia», ha detto.","En la estación la señora me pidió un tren a la costa: «Quiero ver las olas y la playa», dijo."],
  ["Bambino","Io ero con la mamma in libreria. Quella signora guardava un libro sui pesci: diceva che vuole vedere un acquario grandissimo.","Yo estaba con mamá en la librería. Esa señora miraba un libro sobre peces: decía que quiere ver un acuario grandísimo."],
  ["Libraia","Alla fine ha comprato un libro di cucina, su una salsa verde fatta con il basilico.","Al final compró un libro de cocina, sobre una salsa verde hecha con albahaca."],
  ["Bigliettaio","Sul suo biglietto ho letto il nome di una città con un faro famoso, la Lanterna. Comincia con la G.","En su billete leí el nombre de una ciudad con un faro famoso, la Lanterna. Empieza por G."]],
 9:[["Pescatore","Stamattina al porto una signora ha mangiato le trofie con la salsa verde. Poi ha guardato le navi per un'ora.","Esta mañana en el puerto una señora comió trofie con salsa verde. Luego miró los barcos una hora."],
  ["Cassiera dell'acquario","All'acquario ha pagato con la carta: sulla ricevuta c'è il suo nome, Elena Rossi.","En el acuario pagó con tarjeta: en el recibo está su nombre, Elena Rossi."],
  ["Marinaio","Al porto mi ha chiesto: «Ci sono navi per l'Istria?» Le ho detto di no, oggi non ce n'erano. Era molto triste.","En el puerto me preguntó: «¿Hay barcos a Istria?» Le dije que no, hoy no había. Estaba muy triste."],
  ["Signore in stazione","In fila alla stazione Elena parlava al telefono: «Ora vado in montagna, in Trentino.»","En la cola de la estación Elena hablaba por teléfono: «Ahora voy a la montaña, al Trentino.»"],
  ["Guida turistica","Mi ha chiesto di un edificio antico con le torri, dove vivevano i principi. Vuole visitarlo domani.","Me preguntó por un edificio antiguo con torres, donde vivían los príncipes. Quiere visitarlo mañana."],
  ["Signora del bar","Mi ha detto: «Voglio fare una passeggiata vicino all'acqua dolce, tra le montagne. Qui c'è solo il mare!»","Me dijo: «Quiero pasear cerca del agua dulce, entre montañas. ¡Aquí solo hay mar!»"],
  ["Controllore","Ho visto il suo biglietto: va nel capoluogo del Trentino. Il nome? T _ _ _ _ O.","Vi su billete: va a la capital del Trentino. ¿El nombre? T _ _ _ _ O."]],
 10:[["Cuoco","Elena ha mangiato i miei canederli e mi ha detto: «Sono venuta per le montagne e per questo piatto!»","Elena comió mis canederli y me dijo: «¡He venido por las montañas y por este plato!»"],
  ["Receptionist dell'albergo","In albergo ha lasciato il documento alla reception: Elena Rossi, 34 anni.","En el hotel dejó el documento en recepción: Elena Rossi, 34 años."],
  ["Custode del castello","Al castello ha studiato la carta per tre ore. Con una matita ha segnato un piccolo paese con una X.","En el castillo estudió el mapa tres horas. Con un lápiz marcó un pueblecito con una X."],
  ["Bigliettaia","Mi ha chiesto un treno per una città sul mare, vicino alla Slovenia.","Me pidió un tren a una ciudad junto al mar, cerca de Eslovenia."],
  ["Barista","Mi ha detto: «Domani bevo un espresso in un locale storico, con gli specchi antichi.»","Me dijo: «Mañana tomo un espresso en un local histórico, con espejos antiguos.»"],
  ["Signora in piazza","Parlavamo del tempo e lei ha detto: «Ho paura di quel vento fortissimo che soffia nella mia città!»","Hablábamos del tiempo y ella dijo: «¡Me da miedo ese viento fortísimo que sopla en mi ciudad!»"],
  ["Tassista","L'ho portata in stazione. Mi ha detto: «Torno nella mia città.» Anche il suo nome comincia con la T, come Trento!","La llevé a la estación. Me dijo: «Vuelvo a mi ciudad.» ¡Su nombre también empieza por T, como Trento!"]],
 11:[["Barista","Elena è tornata nella sua città: ha bevuto un «nero» nel mio caffè storico. La conosco da quando era piccola!","Elena volvió a su ciudad: tomó un «nero» en mi café histórico. ¡La conozco desde pequeña!"],
  ["Signora del caffè","Conoscevo suo nonno: si chiamava Mario ed era un pescatore nato in Istria.","Conocía a su abuelo: se llamaba Mario y era un pescador nacido en Istria."],
  ["Signora del caffè","Mario mi raccontava sempre: «Ho lasciato il mio paese da bambino. Il paese è disegnato sulla carta del museo.»","Mario siempre me contaba: «Dejé mi pueblo de niño. El pueblo está dibujado en el mapa del museo.»"],
  ["Studente","Elena mi ha detto: «Ora voglio studiare un vecchio libro in una biblioteca dell'università.»","Elena me dijo: «Ahora quiero estudiar un libro antiguo en una biblioteca de la universidad.»"],
  ["Bigliettaio","Ha comprato un biglietto per una città piccola, in una regione verde e senza mare, nel centro d'Italia.","Compró un billete a una ciudad pequeña, en una región verde y sin mar, en el centro de Italia."],
  ["Pasticcera","Nella mia pasticceria mi ha detto: «Voglio comprare dei cioccolatini famosi, quelli con un messaggio d'amore dentro!»","En mi pastelería me dijo: «¡Quiero comprar unos bombones famosos, los que llevan un mensaje de amor dentro!»"],
  ["Controllore","Il suo biglietto va nella città di quei cioccolatini: P _ _ _ _ _ A.","Su billete va a la ciudad de esos bombones: P _ _ _ _ _ A."]],
 12:[["Pasticcere","Elena ha comprato una scatola di cioccolatini e ha chiesto la strada per la biblioteca.","Elena compró una caja de bombones y preguntó el camino a la biblioteca."],
  ["Professoressa","All'università la conoscono: Elena è un'insegnante di geografia. Ama le carte antiche.","En la universidad la conocen: Elena es profesora de geografía. Le encantan los mapas antiguos."],
  ["Bibliotecario","In biblioteca ha trovato il nome del paese del nonno: era sulla costa dell'Istria, ma oggi non esiste più. Ha pianto un po'.","En la biblioteca encontró el nombre del pueblo del abuelo: estaba en la costa de Istria, pero hoy ya no existe. Lloró un poco."],
  ["Bibliotecario","Poi mi ha chiesto: «Dove si prende un traghetto per attraversare l'Adriatico?»","Luego me preguntó: «¿Dónde se coge un ferry para cruzar el Adriático?»"],
  ["Signora in treno","Eravamo sedute vicine: lei va in una città sul mare Adriatico, nelle Marche.","Íbamos sentadas juntas: ella va a una ciudad junto al mar Adriático, en las Marcas."],
  ["Agente di viaggi","Nella mia agenzia ha prenotato un traghetto per il Paese di Spalato e Dubrovnik.","En mi agencia reservó un ferry al país de Split y Dubrovnik."],
  ["Agente di viaggi","Sul biglietto c'è scritto: partenza da A…, il capoluogo delle Marche, dove arrivano e partono le navi.","En el billete pone: salida desde A…, la capital de las Marcas, donde llegan y salen los barcos."]],
 13:[["Marinaio","Elena è qui da stamattina. Mi ha detto: «Stasera prendo la nave per la Croazia.»","Elena está aquí desde esta mañana. Me dijo: «Esta noche cojo el barco a Croacia.»"],
  ["Marinaio","Le ho chiesto perché. Ha detto: «Non voglio vendere la carta antica. Voglio solo trovare il paese di mio nonno.» Ecco il movente.","Le pregunté por qué. Dijo: «No quiero vender el mapa antiguo. Solo quiero encontrar el pueblo de mi abuelo.» Ese es el móvil."],
  ["Poliziotto","Abbiamo letto un suo messaggio: «Dopo il viaggio riporto la carta al museo. Promesso.»","Leímos un mensaje suyo: «Después del viaje devuelvo el mapa al museo. Prometido.»"],
  ["Capitano","La mia nave parte alle nove di sera. Una signora con un rotolo di carta ha comprato il biglietto.","Mi barco sale a las nueve de la noche. Una señora con un rollo de papel compró el billete."],
  ["Gelataia","È venuta a prendere un gelato e mi ha detto: «Aspetto al porto fino a stasera.»","Vino a tomar un helado y me dijo: «Espero en el puerto hasta esta noche.»"],
  ["Capitano","Il suo biglietto è per Spalato, in Croazia.","Su billete es para Split, en Croacia."],
  ["Pescatore","Mi ha chiesto dov'è il punto numero tre del porto, dove si fermano le navi.","Me preguntó dónde está el punto número tres del puerto, donde se paran los barcos."]],
 0:[["Barista","Il ladro ha bevuto un bicerin nel mio caffè. Mi ha detto che il cioccolato lo aiuta a pensare… e ha pensato per due ore!","El ladrón tomó un bicerin en mi café. Me dijo que el chocolate le ayuda a pensar… ¡y pensó dos horas!"],
  ["Barista","Lo ricordo bene: un uomo giovane, forse di trent'anni, con le mani sporche di inchiostro.","Lo recuerdo bien: un hombre joven, de unos treinta años, con las manos manchadas de tinta."],
  ["Cameriera","Pulendo il suo tavolo ho trovato un disegno dimenticato: una macchina con le ali, come quelle di Leonardo.","Limpiando su mesa encontré un dibujo olvidado: una máquina con alas, como las de Leonardo."],
  ["Bigliettaio","In stazione mi ha chiesto un biglietto per la capitale degli stilisti e delle sfilate.","En la estación me pidió un billete a la capital de los diseñadores y los desfiles."],
  ["Studente di ingegneria","Abbiamo parlato di scienza. Mi ha detto che vuole vedere il Museo della Scienza e della Tecnologia.","Hablamos de ciencia. Me dijo que quiere ver el Museo de la Ciencia y la Tecnología."],
  ["Cantante","Io canto nel coro. Mi ha chiesto di un teatro d'opera famosissimo, vicino al Duomo.","Yo canto en el coro. Me preguntó por un teatro de ópera famosísimo, cerca del Duomo."],
  ["Controllore","Il suo treno va in Lombardia: un'ora di viaggio.","Su tren va a Lombardía: una hora de viaje."]],
 1:[["Guida","Ieri il ladro è venuto a vedere l'Ultima Cena di Leonardo. È rimasto davanti al dipinto in silenzio.","Ayer el ladrón vino a ver la Última Cena de Leonardo. Se quedó delante del cuadro en silencio."],
  ["Custode","All'ingresso tutti scrivono il nome sul registro. Lui ha scritto: Marco Ferri.","En la entrada todos escriben su nombre en el registro. Él escribió: Marco Ferri."],
  ["Custode del museo","Al Museo della Scienza è rimasto ore davanti ai modelli delle macchine volanti. Prendeva appunti.","En el Museo de la Ciencia se quedó horas delante de las maquetas de máquinas voladoras. Tomaba apuntes."],
  ["Bigliettaia","Mi ha chiesto un treno per una città costruita sull'acqua.","Me pidió un tren a una ciudad construida sobre el agua."],
  ["Pittore","Ha guardato i miei quadri e ha detto: «Voglio vedere le strade d'acqua di quella città.»","Miró mis cuadros y dijo: «Quiero ver las calles de agua de esa ciudad.»"],
  ["Edicolante","Da me ha comprato una mappa dei vaporetti.","En mi quiosco compró un mapa de los vaporetti."],
  ["Signora in treno","Ha detto: «Lì c'è un disegno famosissimo di Leonardo, l'uomo dentro il cerchio.»","Dijo: «Allí hay un dibujo famosísimo de Leonardo, el hombre dentro del círculo.»"]],
 2:[["Gondoliere","Marco è venuto per l'Uomo Vitruviano, il disegno di Leonardo conservato qui. Me l'ha detto in gondola.","Marco vino por el Hombre de Vitruvio, el dibujo de Leonardo que se conserva aquí. Me lo dijo en la góndola."],
  ["Portiere dell'albergo","In albergo ho visto il suo documento: Marco ha 29 anni.","En el hotel vi su documento: Marco tiene 29 años."],
  ["Portiere dell'albergo","Una sera mi ha detto: «Una persona che si firma La Volpe mi ha aiutato a entrare in biblioteca.»","Una noche me dijo: «Una persona que firma como La Volpe me ayudó a entrar en la biblioteca.»"],
  ["Vetraio di Murano","Mi ha detto che ora va in una città con due costruzioni antiche altissime in centro.","Me dijo que ahora va a una ciudad con dos construcciones antiguas altísimas en el centro."],
  ["Signora del bar","Mi ha detto: «Là posso camminare sotto le strade coperte, anche quando piove.»","Me dijo: «Allí puedo caminar bajo las calles cubiertas, incluso cuando llueve.»"],
  ["Portiere dell'albergo","Prima di partire ha sorriso: «Torno a casa, è la mia città.»","Antes de irse sonrió: «Vuelvo a casa, es mi ciudad.»"],
  ["Professore","Gli ho chiesto dove andava: «Nella città dell'università più antica d'Europa», ha detto.","Le pregunté adónde iba: «A la ciudad de la universidad más antigua de Europa», dijo."]],
 3:[["Salumiere","Marco è tornato nella sua città: al mercato ha mangiato una mortadella enorme!","Marco volvió a su ciudad: ¡en el mercado se comió una mortadela enorme!"],
  ["Sua vicina di casa","Lo conosco: è un inventore senza lavoro. Vuole studiare il quaderno di Leonardo per costruire una macchina volante e vincere un concorso.","Lo conozco: es un inventor sin trabajo. Quiere estudiar el cuaderno de Leonardo para construir una máquina voladora y ganar un concurso."],
  ["Sua vicina di casa","Ha dimenticato il telefono da me. C'era un messaggio con una volpe: «Quando hai finito, porta il quaderno nella mia tana a Firenze.»","Se dejó el teléfono en mi casa. Había un mensaje con un zorro: «Cuando termines, lleva el cuaderno a mi guarida en Florencia.»"],
  ["Guardia notturna","Marco studia di sera, quando è tutto silenzioso.","Marco estudia de noche, cuando todo está en silencio."],
  ["Studentessa","L'ho visto entrare in un palazzo antico vicino a Piazza Maggiore.","Lo vi entrar en un palacio antiguo cerca de la Piazza Maggiore."],
  ["Studentessa","Lì dentro ci sono migliaia di volumi antichi. Io ci studio sempre.","Ahí dentro hay miles de volúmenes antiguos. Yo siempre estudio allí."],
  ["Guardia notturna","Il palazzo si chiama Archiginnasio.","El palacio se llama Archiginnasio."]],

/* --- free walking tour: más información en cada parada --- */
const TOURX={
 0:[["All'inizio doveva essere una sinagoga, ma la comunità ebraica non aveva abbastanza soldi per finirla. Oggi si può salire in ascensore fino a 85 metri e vedere le Alpi.","Al principio iba a ser una sinagoga, pero la comunidad judía no tenía dinero suficiente para terminarla. Hoy se puede subir en ascensor hasta 85 metros y ver los Alpes."],
  ["In quegli anni il Parlamento si riuniva a Palazzo Carignano. Poi la capitale è passata a Firenze e, nel 1871, a Roma.","En esos años el Parlamento se reunía en el Palacio Carignano. Luego la capital pasó a Florencia y, en 1871, a Roma."],
  ["È nato nel 1806, quando il cacao era carissimo: i cioccolatieri hanno aggiunto le nocciole per usarne meno. Ha la forma di una piccola barca rovesciata.","Nació en 1806, cuando el cacao era carísimo: los chocolateros añadieron avellanas para usar menos. Tiene forma de barquita al revés."]],
 1:[["Ci sono voluti quasi seicento anni per finirlo. Sul tetto ci sono più di tremila statue e si può camminare tra le guglie.","Se tardó casi seiscientos años en terminarla. En el tejado hay más de tres mil estatuas y se puede caminar entre los pináculos."],
  ["Qui hanno debuttato molte opere di Verdi e di Puccini. La sera della prima, il 7 dicembre, è un grande evento per tutta la città.","Aquí se estrenaron muchas óperas de Verdi y de Puccini. La noche del estreno, el 7 de diciembre, es un gran acontecimiento para toda la ciudad."],
  ["Si dice che un aiutante di un pittore ha messo lo zafferano nel riso per scherzo, a un matrimonio. Spesso si mangia con l'ossobuco.","Se dice que un ayudante de un pintor echó azafrán en el arroz como broma, en una boda. A menudo se come con osobuco."]],
 2:[["Dalla cima si vedono tutta la laguna e, nei giorni limpidi, anche le Dolomiti. Accanto c'è la Basilica di San Marco, piena di mosaici d'oro.","Desde lo alto se ve toda la laguna y, en los días claros, también los Dolomitas. Al lado está la Basílica de San Marcos, llena de mosaicos de oro."],
  ["Il vaporetto è come un autobus sull'acqua. Anche la polizia, le ambulanze e i pompieri usano le barche.","El vaporetto es como un autobús sobre el agua. También la policía, las ambulancias y los bomberos usan barcas."],
  ["Nel passato con la maschera nessuno sapeva chi eri: ricchi e poveri si mescolavano. Le maschere tradizionali si fanno di cartapesta.","Antiguamente, con la máscara nadie sabía quién eras: ricos y pobres se mezclaban. Las máscaras tradicionales se hacen de cartón piedra."]],
 3:[["Nel Medioevo le famiglie ricche le costruivano per mostrare il loro potere. Sulla più alta si sale con quasi cinquecento gradini.","En la Edad Media las familias ricas las construían para mostrar su poder. A la más alta se sube con casi quinientos escalones."],
  ["Qui hanno studiato Dante, Petrarca e Copernico. Ancora oggi in città vivono tantissimi giovani.","Aquí estudiaron Dante, Petrarca y Copérnico. Todavía hoy en la ciudad viven muchísimos jóvenes."],
  ["La città ha tre soprannomi: «la Dotta» per l'università, «la Grassa» per il cibo e «la Rossa» per il colore dei tetti.","La ciudad tiene tres apodos: «la Docta» por la universidad, «la Gorda» por la comida y «la Roja» por el color de los tejados."]],
 4:[["È una cupola senza impalcature sotto: Brunelleschi ha inventato nuove macchine per costruirla. Ancora oggi è la cupola in muratura più grande del mondo.","Es una cúpula sin andamios debajo: Brunelleschi inventó máquinas nuevas para construirla. Todavía hoy es la cúpula de ladrillo más grande del mundo."],
  ["Sul ponte ci sono negozi di gioielli. Una volta c'erano i macellai, ma il duca li ha mandati via per il cattivo odore.","Sobre el puente hay joyerías. Antes había carnicerías, pero el duque las echó por el mal olor."],
  ["La famiglia Medici pagava gli artisti per lavorare in città. Agli Uffizi si vedono opere di Botticelli, Leonardo e Raffaello.","La familia Médici pagaba a los artistas para trabajar en la ciudad. En los Uffizi se ven obras de Botticelli, Leonardo y Rafael."]],
 5:[["Poteva ospitare circa cinquantamila spettatori. Aveva anche un tetto di tela, il velario, per proteggere il pubblico dal sole.","Podía acoger a unos cincuenta mil espectadores. Tenía incluso un techo de tela, el velario, para proteger al público del sol."],
  ["Si lancia la moneta con la mano destra, sopra la spalla sinistra. Ogni anno si raccolgono più di un milione di euro, che vanno in beneficenza.","La moneda se lanza con la mano derecha por encima del hombro izquierdo. Cada año se recoge más de un millón de euros, que va a beneficencia."],
  ["Il Vaticano ha meno di mille abitanti, la sua posta e le sue guardie svizzere. Nella Cappella Sistina c'è il famoso soffitto di Michelangelo.","El Vaticano tiene menos de mil habitantes, su propio correo y su guardia suiza. En la Capilla Sixtina está el famoso techo de Miguel Ángel."]],
 6:[["Gli scavi di Pompei mostrano case, strade e negozi romani come erano duemila anni fa. Oggi intorno al vulcano c'è un parco nazionale.","Las excavaciones de Pompeya muestran casas, calles y tiendas romanas como eran hace dos mil años. Hoy alrededor del volcán hay un parque nacional."],
  ["Ha i colori della bandiera italiana: rosso il pomodoro, bianca la mozzarella, verde il basilico. L'arte del pizzaiolo napoletano è patrimonio UNESCO.","Tiene los colores de la bandera italiana: rojo el tomate, blanca la mozzarella, verde la albahaca. El arte del pizzero napolitano es patrimonio de la UNESCO."],
  ["Il caffè si beve in piedi, al banco, e spesso con un bicchiere d'acqua. Molti napoletani ne bevono tre o quattro al giorno.","El café se toma de pie, en la barra, y a menudo con un vaso de agua. Muchos napolitanos toman tres o cuatro al día."]],
 7:[["Dentro ci sono le tombe dei re normanni e dell'imperatore Federico II. Dal tetto si vede tutta la città fino al mare.","Dentro están las tumbas de los reyes normandos y del emperador Federico II. Desde el tejado se ve toda la ciudad hasta el mar."],
  ["Gli arabi hanno portato gli agrumi, lo zucchero e il gelsomino. Molte parole siciliane vengono dall'arabo.","Los árabes trajeron los cítricos, el azúcar y el jazmín. Muchas palabras sicilianas vienen del árabe."],
  ["Al mercato si trovano pesce, frutta e cibo di strada come le arancine e il pane con la milza. Ogni venditore canta i suoi prodotti in modo diverso.","En el mercado hay pescado, fruta y comida callejera como las arancine y el pan con bazo. Cada vendedor canta sus productos de forma distinta."]],
 8:[["In centro ci sono ancora l'Arco di Augusto, le mura e un teatro romano. Le strade seguono ancora lo schema a griglia dell'accampamento romano.","En el centro todavía están el Arco de Augusto, las murallas y un teatro romano. Las calles siguen el trazado en cuadrícula del campamento romano."],
  ["È alto 4.808 metri. Un tunnel lungo più di undici chilometri passa sotto la montagna e arriva in Francia.","Mide 4.808 metros. Un túnel de más de once kilómetros pasa bajo la montaña y llega a Francia."],
  ["Si fa con il latte delle mucche che d'estate mangiano l'erba di montagna. Matura in grotte fresche per almeno tre mesi.","Se hace con la leche de vacas que en verano comen hierba de montaña. Madura en cuevas frescas al menos tres meses."]],
 9:[["È uno dei fari più antichi del mondo ancora in funzione. La sua luce si vede fino a cinquanta chilometri dal mare.","Es uno de los faros más antiguos del mundo todavía en funcionamiento. Su luz se ve hasta a cincuenta kilómetros mar adentro."],
  ["Tradizionalmente si prepara nel mortaio, con un pestello di legno: da qui viene il nome. Si mangia con le trofie o le trenette.","Tradicionalmente se prepara en el mortero, con un mazo de madera: de ahí viene el nombre. Se come con trofie o trenette."],
  ["Ci sono pinguini, delfini, foche e tanti pesci tropicali. È stato costruito per l'Expo del 1992, cinquecento anni dopo il viaggio di Colombo.","Hay pingüinos, delfines, focas y muchos peces tropicales. Se construyó para la Expo de 1992, quinientos años después del viaje de Colón."]],
 10:[["Dentro c'è il ciclo dei mesi, un affresco del 1400 che mostra la vita di ogni giorno: il lavoro nei campi, la neve, le feste.","Dentro está el ciclo de los meses, un fresco de 1400 que muestra la vida diaria: el trabajo en el campo, la nieve, las fiestas."],
  ["Al tramonto le rocce delle Dolomiti diventano rosa e arancioni: si chiama «enrosadira». D'inverno ci sono tante piste da sci.","Al atardecer las rocas de los Dolomitas se vuelven rosas y naranjas: se llama «enrosadira». En invierno hay muchas pistas de esquí."],
  ["Si mangiano in brodo o con il burro fuso. Nascono come piatto povero, per non buttare il pane vecchio.","Se comen en caldo o con mantequilla fundida. Nacieron como plato humilde, para no tirar el pan duro."]],
 11:[["Di sera i palazzi illuminati si riflettono nell'acqua. Intorno ci sono il municipio e altri edifici dell'Ottocento.","Por la noche los palacios iluminados se reflejan en el agua. Alrededor están el ayuntamiento y otros edificios del siglo XIX."],
  ["Per questo in città si sentono tante lingue e ci sono chiese di religioni diverse. La cucina mescola piatti italiani, austriaci e sloveni.","Por eso en la ciudad se oyen muchos idiomas y hay iglesias de religiones distintas. La cocina mezcla platos italianos, austriacos y eslovenos."],
  ["Qui ha scritto una parte del suo romanzo più famoso, l'Ulisse. In centro c'è una sua statua di bronzo che cammina sul marciapiede.","Aquí escribió parte de su novela más famosa, el Ulises. En el centro hay una estatua suya de bronce que camina por la acera."]],
 12:[["È decorata con sculture che raccontano i mesi dell'anno, le arti e le storie della Bibbia. Davanti c'è il Duomo, con una grande scalinata.","Está decorada con esculturas que cuentan los meses del año, las artes y historias de la Biblia. Delante está el Duomo, con una gran escalinata."],
  ["Si trova in un bel palazzo del Settecento. Molti studenti stranieri restano in città per mesi e la sera la piazza è piena di lingue diverse.","Está en un bonito palacio del siglo XVIII. Muchos estudiantes extranjeros se quedan meses y por la noche la plaza se llena de idiomas distintos."],
  ["Si fa in ottobre e arrivano quasi un milione di visitatori. Qui c'è anche la fabbrica dei famosi cioccolatini con il bigliettino d'amore.","Se celebra en octubre y llegan casi un millón de visitantes. Aquí está también la fábrica de los famosos bombones con la notita de amor."]],
 13:[["È stato costruito in onore dell'imperatore Traiano, che aveva fatto migliorare la costa. È fatto di marmo bianco e guarda verso il mare.","Se construyó en honor del emperador Trajano, que mandó mejorar la costa. Es de mármol blanco y mira al mar."],
  ["La città si allunga intorno a un promontorio, come un braccio piegato. Da qui il sole sorge e tramonta sul mare.","La ciudad se extiende alrededor de un promontorio, como un brazo doblado. Desde aquí el sol sale y se pone sobre el mar."],
  ["Il pesce arrivava secco dalla Norvegia con le navi dei mercanti. Si cucina lentamente, per molte ore.","El pescado llegaba seco desde Noruega en los barcos de los mercaderes. Se cocina despacio, durante muchas horas."]],
 14:[["Sulla facciata ci sono le statue di Plinio il Vecchio e Plinio il Giovane, due scrittori romani nati a Como. Dentro ci sono arazzi antichi.","En la fachada están las estatuas de Plinio el Viejo y Plinio el Joven, dos escritores romanos nacidos en Como. Dentro hay tapices antiguos."],
  ["L'unità di misura «volt» porta il suo nome. In un museo vicino al lago ci sono i suoi strumenti.","La unidad de medida «voltio» lleva su nombre. En un museo junto al lago están sus instrumentos."],
  ["Il lago è lungo 46 chilometri e ha la forma di una Y rovesciata. Sulle sue rive ci sono ville eleganti con giardini.","El lago mide 46 kilómetros y tiene forma de Y al revés. En sus orillas hay villas elegantes con jardines."]],
 15:[["Le hanno costruite i Veneziani nel 1500 per difendere la città. Sono lunghe più di cinque chilometri e oggi sono una bella passeggiata.","Las construyeron los venecianos en el siglo XVI para defender la ciudad. Miden más de cinco kilómetros y hoy son un bonito paseo."],
  ["Funziona dal 1887 e il viaggio dura pochi minuti. Dall'alto si vede tutta la pianura.","Funciona desde 1887 y el viaje dura pocos minutos. Desde arriba se ve toda la llanura."],
  ["È fatta di farina di mais e una volta si mangiava tutti i giorni. C'è anche un dolce giallo che si chiama «polenta e osei».","Se hace con harina de maíz y antes se comía todos los días. Hay también un dulce amarillo que se llama «polenta e osei»."]],
 16:[["Ogni estate ospita un grande festival d'opera, con migliaia di persone sedute sulle gradinate. Di sera il pubblico accende piccole candele.","Cada verano acoge un gran festival de ópera, con miles de personas sentadas en las gradas. Por la noche el público enciende pequeñas velas."],
  ["Ogni anno arrivano migliaia di lettere per Giulietta da tutto il mondo. Un gruppo di volontari risponde a tutte.","Cada año llegan miles de cartas para Julieta de todo el mundo. Un grupo de voluntarios las responde todas."],
  ["Il fiume fa una grande curva intorno al centro storico. Il Ponte Pietra è il ponte più antico della città, del periodo romano.","El río hace una gran curva alrededor del centro histórico. El Ponte Pietra es el puente más antiguo de la ciudad, de época romana."]],
 17:[["Qui c'è il primo teatro anatomico del mondo, del 1595, dove i medici studiavano il corpo umano. Nel 1678 qui si è laureata la prima donna al mondo, Elena Cornaro Piscopia.","Aquí está el primer teatro anatómico del mundo, de 1595, donde los médicos estudiaban el cuerpo humano. En 1678 se licenció aquí la primera mujer del mundo, Elena Cornaro Piscopia."],
  ["Al centro c'è un'isola verde circondata da un canale e da 78 statue. Il sabato c'è un grande mercato.","En el centro hay una isla verde rodeada por un canal y 78 estatuas. Los sábados hay un gran mercado."],

wpop.addEventListener("click",async ev=>{ev.stopPropagation();const b=ev.target.closest("button");if(!b)return;clearTimeout(wpT);
  if(b.dataset.wsay)speak(b.dataset.wsay);
  if(b.dataset.wsent){const s=b.dataset.wsent;b.remove();const sp=document.createElement("span");sp.className="wsent";sp.textContent="…";wpop.appendChild(sp);const r=await translateWord(s);sp.textContent=r?"«"+r.t+"»":trp("Sin conexión.","Senza connessione.")}
  wpT=setTimeout(hidePop,10000)});
document.addEventListener("pointerdown",ev=>{if(!wpop.contains(ev.target))hidePop()},true);
/* toque simple sobre texto → traduce; mantener pulsado (también sobre botones) → traduce sin activar el botón */
let lp=null,lpFired=false;
ov.addEventListener("pointerdown",ev=>{lpFired=false;clearTimeout(lp&&lp.t);const x=ev.clientX,y=ev.clientY,tg=ev.target;
  lp={x,y,t:setTimeout(()=>{let hit=wordAt(x,y);if(!hit){const b=tg.closest&&tg.closest("button");const tx=b&&b.textContent.trim();if(tx&&tx.split(/\s+/).length<=3&&WCH.test(tx))hit={w:tx.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ' ]/g,"").trim(),sent:""}}
    if(hit&&hit.w){lpFired=true;showWord(hit,x,y);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}},480)}},true);
const lpCancel=ev=>{if(lp&&(ev.type!=="pointermove"||Math.abs(ev.clientX-lp.x)+Math.abs(ev.clientY-lp.y)>10)){clearTimeout(lp.t)}};
["pointerup","pointercancel","pointermove"].forEach(t=>ov.addEventListener(t,lpCancel,true));
ov.addEventListener("click",ev=>{if(lpFired){lpFired=false;ev.preventDefault();ev.stopPropagation();return}
  if(hasHandler(ev.target))return;const hit=wordAt(ev.clientX,ev.clientY);if(hit){ev.stopPropagation();showWord(hit,ev.clientX,ev.clientY)}},true);
ov.addEventListener("contextmenu",ev=>ev.preventDefault());
</script>
